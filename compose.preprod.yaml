services:
  odoo:
    # A qualified release is built explicitly as Dockerfile's distribution
    # stage. Runtime startup must never rebuild or bind-mount another checkout.
    build: !reset null
    environment:
      ODOO_ADDONS_PATH: /opt/odoo/addons,/opt/odoo/odoo/addons,/opt/odoo/custom-addons,/opt/odoo/oca-addons
      USL_USER_DOCS_PATH: /opt/odoo/docs/users
    ports: !override
      - "127.0.0.1:${ODOO_HTTP_PORT}:8069"
      - "127.0.0.1:${ODOO_GEVENT_PORT}:8072"
    volumes: !override
      - odoo-data:/var/lib/odoo
      - ${USL_DOCUMENT_RENDERER_CERT_DIR:-./private/document-renderer-certs}:/run/secrets/document-renderer:ro
      - ${USL_SIGN_ODOO_SECRET_DIR:-./.secrets/sign/odoo}:/run/usl-sign:ro

  init-db:
    environment:
      ODOO_ADDONS_PATH: /opt/odoo/addons,/opt/odoo/odoo/addons,/opt/odoo/custom-addons,/opt/odoo/oca-addons
      USL_USER_DOCS_PATH: /opt/odoo/docs/users
    volumes: !override
      - odoo-data:/var/lib/odoo
      - ${USL_DOCUMENT_RENDERER_CERT_DIR:-./private/document-renderer-certs}:/run/secrets/document-renderer:ro
      - ${USL_SIGN_ODOO_SECRET_DIR:-./.secrets/sign/odoo}:/run/usl-sign:ro

  usl-document-renderer:
    # Production-like admission consumes only the explicitly digest-pinned
    # renderer image; it must never rebuild from the checkout.
    build: !reset null

  usl-sign-dss:
    # DSS is qualified and published independently from the Odoo image.
    build: !reset null

  paperless-webserver:
    build: !reset null
    ports: !override
      - "127.0.0.1:${PAPERLESS_HTTP_PORT}:8000"
