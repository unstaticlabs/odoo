site_name: USL Odoo User Guide
site_description: User-facing documentation for the USL Odoo fork.
docs_dir: docs/users
site_dir: artifacts/user-docs/site
theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
plugins:
  - search
nav:
