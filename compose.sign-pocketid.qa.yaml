services:
  pocket-id:
    build:
      context: .
      dockerfile: services/usl-pocket-id/Dockerfile
      args:
        POCKET_ID_COMMIT: b3fb8de5bc55aa813a27b4e15c1d761026fcceaa
    image: usl-pocket-id-sign:v2.12.0-fresh-passkey
    environment:
      APP_NAME: USL Sign Pocket ID QA
    ports: !override
      - "${USL_SIGN_POCKETID_BIND_ADDRESS:-127.0.0.1}:${POCKET_ID_HTTP_PORT:-1411}:1411"

  paperless-webserver:
    ports: !override
      - "${USL_SIGN_POCKETID_BIND_ADDRESS:-127.0.0.1}:${PAPERLESS_HTTP_PORT:-8010}:8000"

  odoo:
    depends_on:
      pocket-id:
        condition: service_healthy
      usl-sign-dss:
        condition: service_healthy
      usl-sign-step-ca:
        condition: service_healthy
    environment:
      ODOO_DB_NAME: odoo_dev
      USL_POCKET_ID_SIGN_CLIENT_ID: ${POCKET_ID_SIGN_CLIENT_ID:?Missing dedicated Sign client ID}
      USL_POCKET_ID_SIGN_CLIENT_SECRET: ${POCKET_ID_SIGN_CLIENT_SECRET:?Missing dedicated Sign client secret}
      USL_POCKET_ID_SIGN_REQUIRED_GROUP: ${POCKET_ID_SIGN_GROUP_NAME:?Missing Sign signer group}
      USL_POCKET_ID_SIGN_FRESH_REQUIRED: "1"
      USL_POCKET_ID_ALLOW_PRIVATE_HTTP_QA: ${USL_SIGN_POCKETID_PRIVATE_QA:-0}
    # Loopback remains the safe default. A review tenant may bind to one exact,
    # validated private/Tailscale IPv4 address, never every host interface.
    ports: !override
      - "${USL_SIGN_POCKETID_BIND_ADDRESS:-127.0.0.1}:${ODOO_HTTP_PORT:-16669}:8069"
      - "${USL_SIGN_POCKETID_BIND_ADDRESS:-127.0.0.1}:${ODOO_GEVENT_PORT:-16672}:8072"

  init-db:
    environment:
      USL_POCKET_ID_SIGN_CLIENT_ID: ${POCKET_ID_SIGN_CLIENT_ID:?Missing dedicated Sign client ID}
      USL_POCKET_ID_SIGN_CLIENT_SECRET: ${POCKET_ID_SIGN_CLIENT_SECRET:?Missing dedicated Sign client secret}
      USL_POCKET_ID_SIGN_REQUIRED_GROUP: ${POCKET_ID_SIGN_GROUP_NAME:?Missing Sign signer group}
      USL_POCKET_ID_SIGN_FRESH_REQUIRED: "1"
      USL_POCKET_ID_ALLOW_PRIVATE_HTTP_QA: ${USL_SIGN_POCKETID_PRIVATE_QA:-0}

  test:
    depends_on:
      usl-sign-dss:
        condition: service_healthy
      usl-sign-step-ca:
        condition: service_healthy
    environment:
      USL_POCKET_ID_SIGN_CLIENT_ID: ${POCKET_ID_SIGN_CLIENT_ID:?Missing dedicated Sign client ID}
      USL_POCKET_ID_SIGN_CLIENT_SECRET: ${POCKET_ID_SIGN_CLIENT_SECRET:?Missing dedicated Sign client secret}
      USL_POCKET_ID_SIGN_REQUIRED_GROUP: ${POCKET_ID_SIGN_GROUP_NAME:?Missing Sign signer group}
      USL_POCKET_ID_SIGN_FRESH_REQUIRED: "1"
      USL_POCKET_ID_ALLOW_PRIVATE_HTTP_QA: ${USL_SIGN_POCKETID_PRIVATE_QA:-0}
