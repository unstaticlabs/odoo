name: ${COMPOSE_PROJECT_NAME:-usl-odoo-saas-19-3}

x-odoo-mcp-environment: &odoo-mcp-environment
  MCP_HOST: 0.0.0.0
  MCP_PORT: 3000
  MCP_PUBLIC_ORIGIN: ${ODOO_MCP_PUBLIC_ORIGIN:-http://localhost:3000}
  MCP_ALLOWED_HOSTS: ${ODOO_MCP_ALLOWED_HOSTS:-mcp.localhost,localhost,127.0.0.1}
  MCP_HEALTHCHECK_HOST: ${ODOO_MCP_HEALTHCHECK_HOST:-mcp.localhost}
  MCP_ALLOWED_ORIGINS: ${ODOO_MCP_ALLOWED_ORIGINS:-chatgpt.com,claude.ai,mcp.localhost,localhost,127.0.0.1}
  MCP_ALLOW_LOCAL_HTTP_ODOO: ${ODOO_MCP_ALLOW_LOCAL_HTTP_ODOO:-true}
  ODOO_PUBLIC_ORIGIN: ${ODOO_PUBLIC_BASE_URL:-http://odoo.localhost:8069}
  ODOO_INTERNAL_ORIGIN: http://odoo:8069
  ODOO_DATABASE: ${ODOO_DB_NAME:-odoo_dev}
  MCP_TARGET_CONCURRENCY: ${ODOO_MCP_TARGET_CONCURRENCY:-8}
  MCP_MAX_REQUEST_BYTES: ${ODOO_MCP_MAX_REQUEST_BYTES:-1048576}
  MCP_MAX_RESPONSE_BYTES: ${ODOO_MCP_MAX_RESPONSE_BYTES:-1048576}
  MCP_OAUTH_ENABLED: "true"
  MCP_OAUTH_DATABASE: /data/oauth.sqlite
  BETTER_AUTH_SECRET_FILE: /run/secrets/odoo_mcp_better_auth_secret
  MCP_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/odoo_mcp_credential_encryption_key
  MCP_OAUTH_TRUSTED_ORIGINS: ${ODOO_MCP_OAUTH_TRUSTED_ORIGINS:-https://chatgpt.com,https://claude.ai,http://localhost:3000}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  accounting-source-db:
    profiles: ["accounting-compat"]
    image: ${ACCOUNTING_SOURCE_POSTGRES_IMAGE:-pgvector/pgvector:pg16-bookworm}
    restart: "no"
    environment:
      POSTGRES_DB: ${ACCOUNTING_SOURCE_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${ACCOUNTING_SOURCE_POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${ACCOUNTING_SOURCE_POSTGRES_PASSWORD:-odoo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - accounting-source-postgres-data:/var/lib/postgresql/data

  paperless-preflight:
    profiles: ["paperless"]
    image: alpine:3.24.1
    restart: "no"
    environment:
      USL_DEPLOYMENT_ENV: ${USL_DEPLOYMENT_ENV:-development}
      POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:16-bookworm}
      PAPERLESS_IMAGE: ${PAPERLESS_IMAGE:-usl-paperless-ngx:3.0.5-usl.9}
      PAPERLESS_BASE_IMAGE: ${PAPERLESS_BASE_IMAGE:-ghcr.io/paperless-ngx/paperless-ngx@sha256:65a4cabf0169ea7fbd90ab7bb28ba3f8b5909613635acda1a03ad606f34b456b}
      OLLAMA_IMAGE: ${OLLAMA_IMAGE:-ollama/ollama:0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2}
      USL_OLLAMA_RUNTIME: ${USL_OLLAMA_RUNTIME:-container}
      PAPERLESS_AI_ENABLED: ${PAPERLESS_AI_ENABLED:-true}
      PAPERLESS_USL_DEFER_SEMANTIC_INDEX: ${PAPERLESS_USL_DEFER_SEMANTIC_INDEX:-false}
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ${PAPERLESS_AI_LLM_EMBEDDING_BACKEND:-ollama}
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: ${PAPERLESS_AI_LLM_EMBEDDING_MODEL:-usl-bge-m3:documents-20260824-rc1}
      PAPERLESS_AI_LLM_EMBEDDING_CHUNK_SIZE: ${PAPERLESS_AI_LLM_EMBEDDING_CHUNK_SIZE:-512}
      PAPERLESS_AI_LLM_EMBEDDING_BATCH_SIZE: ${PAPERLESS_AI_LLM_EMBEDDING_BATCH_SIZE:-32}
      PAPERLESS_POSTGRES_IMAGE: ${PAPERLESS_POSTGRES_IMAGE:-postgres:16-bookworm}
      PAPERLESS_BROKER_IMAGE: ${PAPERLESS_BROKER_IMAGE:-valkey/valkey:9.1.2-alpine}
      PAPERLESS_GOTENBERG_IMAGE: ${PAPERLESS_GOTENBERG_IMAGE:-gotenberg/gotenberg:8.36@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466}
      PAPERLESS_TIKA_IMAGE: ${PAPERLESS_TIKA_IMAGE:-apache/tika:3.3.1.0-full}
      PAPERLESS_DB_PASSWORD: ${PAPERLESS_DB_PASSWORD:-paperless-change-me-dev-only}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-paperless-change-me-dev-only}
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL:-http://127.0.0.1:8010}
      PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: ${PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL:-https}
      PAPERLESS_SSO_BASE_GROUP: ${PAPERLESS_SSO_BASE_GROUP:-USL Odoo document users}
      PAPERLESS_ALLOWED_HOSTS: ${PAPERLESS_ALLOWED_HOSTS:-localhost,127.0.0.1,paperless-webserver}
      PAPERLESS_EMPTY_TRASH_DELAY: ${PAPERLESS_EMPTY_TRASH_DELAY:-36500}
      PAPERLESS_OIDC_ENABLED: ${PAPERLESS_OIDC_ENABLED:-0}
      PAPERLESS_DISABLE_REGULAR_LOGIN: ${PAPERLESS_DISABLE_REGULAR_LOGIN:-false}
      PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: ${PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS:-false}
      PAPERLESS_PUBLIC_BASE_URL: ${PAPERLESS_PUBLIC_BASE_URL:-}
      POCKET_ID_APP_URL: ${POCKET_ID_APP_URL:-}
      POCKET_ID_CLIENT_ID: ${POCKET_ID_CLIENT_ID:-}
      POCKET_ID_PAPERLESS_CLIENT_ID: ${POCKET_ID_PAPERLESS_CLIENT_ID:-}
      POCKET_ID_PAPERLESS_CLIENT_SECRET: ${POCKET_ID_PAPERLESS_CLIENT_SECRET:-}
      POCKET_ID_IMAGE: ${POCKET_ID_IMAGE:-ghcr.io/pocket-id/pocket-id:v2.14.0@sha256:01540977dcf4c7b41b1159f34d68e4632f2658d62790e460ca65a42722b13c4a}
      ODOO_IMAGE: ${ODOO_IMAGE:-usl-odoo-saas-19-3-odoo:latest}
      ODOO_MCP_IMAGE: ${ODOO_MCP_IMAGE:-usl-odoo-mcp@sha256:9ea7c1b2ed5a27b7762cc98e83e403757e7dfbd717ce64dfd775484b98fdfc7a}
      ODOO_MCP_PUBLIC_ORIGIN: ${ODOO_MCP_PUBLIC_ORIGIN:-http://mcp.localhost:3000}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      ODOO_DB_FILTER: ${ODOO_DB_FILTER:-^odoo_dev$}
      ODOO_PROXY_MODE: ${ODOO_PROXY_MODE:-False}
      ODOO_LIST_DB: ${ODOO_LIST_DB:-True}
      USL_PERSONAL_AI_MASTER_KEYS_PATH: /run/secrets/usl_personal_ai_master_keys
    secrets:
      - source: usl_personal_ai_master_keys
        target: usl_personal_ai_master_keys
    command:
      - /bin/sh
      - -ec
      - |
        [ -s "$${USL_PERSONAL_AI_MASTER_KEYS_PATH}" ] || {
          echo "The personal AI master-key secret is required"; exit 1;
        }
        if [ "$${PAPERLESS_OIDC_ENABLED}" = "1" ]; then
          [ -n "$${POCKET_ID_CLIENT_ID}" ] || { echo "The Odoo Pocket client ID is required"; exit 1; }
          [ -n "$${POCKET_ID_PAPERLESS_CLIENT_ID}" ] || { echo "The Paperless Pocket client ID is required"; exit 1; }
          [ -n "$${POCKET_ID_PAPERLESS_CLIENT_SECRET}" ] || { echo "The Paperless Pocket client secret is required"; exit 1; }
          [ "$${POCKET_ID_CLIENT_ID}" != "$${POCKET_ID_PAPERLESS_CLIENT_ID}" ] || { echo "Odoo and Paperless require separate Pocket clients"; exit 1; }
          [ "$${PAPERLESS_PUBLIC_BASE_URL}" = "$${PAPERLESS_PUBLIC_URL}" ] || { echo "Paperless OIDC callback base must match its public URL"; exit 1; }
          [ -n "$${PAPERLESS_SSO_BASE_GROUP}" ] || { echo "Paperless SSO base group is required"; exit 1; }
          case "$${PAPERLESS_PUBLIC_URL}:$${PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL}" in
            http://*:http|https://*:https) :;;
            *) echo "Paperless OIDC callback protocol must match its public URL"; exit 1;;
          esac
        fi
        case "$${USL_DEPLOYMENT_ENV}" in
        staging|preproduction|production)
          [ "$${#PAPERLESS_DB_PASSWORD}" -ge 24 ] || { echo "Paperless database secret is too short"; exit 1; }
          [ "$${#PAPERLESS_SECRET_KEY}" -ge 48 ] || { echo "Paperless application secret is too short"; exit 1; }
          [ "$${PAPERLESS_DB_PASSWORD}" != "paperless-change-me-dev-only" ] || exit 1
          [ "$${PAPERLESS_SECRET_KEY}" != "paperless-change-me-dev-only" ] || exit 1
          [ -n "$${POCKET_ID_APP_URL}" ] || { echo "Pocket ID issuer is required"; exit 1; }
          case "$${POCKET_ID_APP_URL}" in https://auth.unstaticlabs.com|https://auth.unstaticlabs.com/) :;; *) echo "Production-like Pocket ID issuer must be auth.unstaticlabs.com"; exit 1;; esac
          case "$${PAPERLESS_PUBLIC_URL}" in
            http://127.0.0.1:*)
              [ "$${USL_DEPLOYMENT_ENV}" = "staging" ] || { echo "Only staging may keep Paperless internal"; exit 1; }
              [ "$${PAPERLESS_OIDC_ENABLED}" = "0" ] || { echo "Internal-only Paperless must disable OIDC"; exit 1; }
              [ -z "$${PAPERLESS_PUBLIC_BASE_URL}" ] || { echo "Internal-only Paperless must not publish an OIDC callback base"; exit 1; }
              ;;
            https://*)
              [ "$${PAPERLESS_OIDC_ENABLED}" = "1" ] || { echo "Public Paperless requires Pocket ID login"; exit 1; }
              [ "$${PAPERLESS_DISABLE_REGULAR_LOGIN}" = "true" ] || { echo "Public Paperless must disable interactive password login"; exit 1; }
              [ "$${PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS}" = "false" ] || { echo "Pocket groups must not become Paperless authorization groups"; exit 1; }
              [ "$${PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL}" = "https" ] || { echo "Public Paperless OIDC callbacks must use HTTPS"; exit 1; }
              ;;
            *) echo "Paperless must use exact loopback HTTP or public HTTPS"; exit 1;;
          esac
          [ "$${ODOO_DB_PASSWORD}" != "odoo" ] || { echo "Odoo database password must not use the development default"; exit 1; }
          [ "$${ODOO_ADMIN_PASSWORD}" != "admin" ] || { echo "Odoo master password must not use the QA default"; exit 1; }
          case "$${ODOO_DB_FILTER}" in
            ""|"^odoo_dev$"|".*"|"^.*$") echo "Unsafe Odoo database filter"; exit 1;;
          esac
          [ "$${ODOO_PROXY_MODE}" = "True" ] || { echo "Production-like Odoo must enable proxy mode"; exit 1; }
          [ "$${ODOO_LIST_DB}" = "False" ] || { echo "Production-like Odoo must disable database listing"; exit 1; }
          for image in \
            "$${POSTGRES_IMAGE}" \
            "$${ODOO_IMAGE}" \
            "$${ODOO_MCP_IMAGE}" \
            "$${PAPERLESS_IMAGE}" \
            "$${PAPERLESS_POSTGRES_IMAGE}" \
            "$${PAPERLESS_BROKER_IMAGE}" \
            "$${PAPERLESS_GOTENBERG_IMAGE}" \
            "$${PAPERLESS_TIKA_IMAGE}" \
            "$${OLLAMA_IMAGE}" \
            "$${POCKET_ID_IMAGE}"
          do
            case "$${image}" in
              ""|latest|*:latest|*@sha256:) echo "Every production-like image must be pinned: $${image:-<empty>}"; exit 1;;
              *:*|*@sha256:*) :;;
              *) echo "Image must include an exact tag or digest: $${image}"; exit 1;;
            esac
          done
          [ "$${PAPERLESS_BASE_IMAGE}" = "ghcr.io/paperless-ngx/paperless-ngx@sha256:65a4cabf0169ea7fbd90ab7bb28ba3f8b5909613635acda1a03ad606f34b456b" ] || {
            echo "Paperless distribution base digest is not qualified"; exit 1;
          }
          [ "$${PAPERLESS_AI_ENABLED}" = "true" ] || { echo "Paperless local AI index must be enabled"; exit 1; }
          [ "$${PAPERLESS_USL_DEFER_SEMANTIC_INDEX}" = "false" ] || { echo "Deferred semantic indexing is migration-only"; exit 1; }
          [ "$${PAPERLESS_AI_LLM_EMBEDDING_BACKEND}" = "ollama" ] || { echo "Paperless embeddings must use Ollama"; exit 1; }
          case "$${USL_OLLAMA_RUNTIME:-container}:$${PAPERLESS_AI_LLM_EMBEDDING_MODEL}" in
            external:bge-m3:latest|container:usl-bge-m3:documents-20260824-rc1) :;;
            *) echo "Paperless BGE-M3 model is not qualified for the selected runtime"; exit 1;;
          esac
          [ "$${PAPERLESS_AI_LLM_EMBEDDING_CHUNK_SIZE}" = "512" ] || { echo "Paperless embedding chunk size is not frozen"; exit 1; }
          [ "$${PAPERLESS_AI_LLM_EMBEDDING_BATCH_SIZE}" = "32" ] || { echo "Paperless embedding batch size is not qualified"; exit 1; }
          case "$${ODOO_MCP_PUBLIC_ORIGIN}" in https://*) :;; *) echo "Production Odoo MCP URL must use HTTPS"; exit 1;; esac
          case "$${ODOO_MCP_PUBLIC_ORIGIN}" in *127.0.0.1*|*localhost*) echo "Production-like Odoo MCP URL must not be local-only"; exit 1;; esac
          if [ "$${PAPERLESS_OIDC_ENABLED}" = "1" ]; then
            case "$${PAPERLESS_PUBLIC_URL}" in *127.0.0.1*|*localhost*) echo "Public Paperless URL must not be local-only"; exit 1;; esac
            case "$${PAPERLESS_ALLOWED_HOSTS}" in *localhost*|*127.0.0.1*) echo "Public Paperless allowed hosts must not include local QA hosts"; exit 1;; esac
          fi
          case "$${PAPERLESS_EMPTY_TRASH_DELAY}" in
            ""|*[!0-9]*) echo "Paperless Trash retention must be an explicit number of days"; exit 1;;
          esac
          if [ "$${PAPERLESS_EMPTY_TRASH_DELAY}" -lt 36500 ]; then
            echo "Paperless automatic Trash emptying must use the 100-year safety delay; Odoo owns retention approval"
            exit 1
          fi
          ;;
        esac

  paperless-db:
    profiles: ["paperless"]
    image: ${PAPERLESS_POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAPERLESS_DB_NAME:-paperless}
      POSTGRES_USER: ${PAPERLESS_DB_USER:-paperless}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:-paperless-change-me-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - paperless-postgres-data:/var/lib/postgresql/data

  paperless-broker:
    profiles: ["paperless"]
    image: ${PAPERLESS_BROKER_IMAGE:-valkey/valkey:9.1.2-alpine}
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - paperless-broker-data:/data

  paperless-ollama:
    profiles: ["paperless"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 15s
    volumes:
      - paperless-ollama-data:/root/.ollama

  paperless-model-preflight:
    profiles: ["paperless"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2}
    restart: "no"
    depends_on:
      paperless-model-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://paperless-ollama:11434
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: ${PAPERLESS_AI_LLM_EMBEDDING_MODEL:-usl-bge-m3:documents-20260824-rc1}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        ollama show "$${PAPERLESS_AI_LLM_EMBEDDING_MODEL}" >/dev/null

  paperless-model-init:
    profiles: ["paperless"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2}
    restart: "no"
    depends_on:
      paperless-ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://paperless-ollama:11434
      USL_BGE_SOURCE_MODEL: bge-m3:latest
      USL_BGE_TARGET_MODEL: usl-bge-m3:documents-20260824-rc1
      USL_BGE_MANIFEST_SHA256: 7907646426070047a77226ac3e684fbbe8410524f7b4a74d02837e43f2146bab
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        source_manifest=/root/.ollama/models/manifests/registry.ollama.ai/library/bge-m3/latest
        target_manifest=/root/.ollama/models/manifests/registry.ollama.ai/library/usl-bge-m3/documents-20260824-rc1
        if [ ! -f "$$target_manifest" ]; then
          ollama pull "$$USL_BGE_SOURCE_MODEL"
          actual="$$(sha256sum "$$source_manifest" | awk '{print $$1}')"
          [ "$$actual" = "$$USL_BGE_MANIFEST_SHA256" ] || {
            echo "Downloaded BGE-M3 manifest is not the qualified release" >&2
            exit 1
          }
          ollama cp "$$USL_BGE_SOURCE_MODEL" "$$USL_BGE_TARGET_MODEL"
        fi
        actual="$$(sha256sum "$$target_manifest" | awk '{print $$1}')"
        [ "$$actual" = "$$USL_BGE_MANIFEST_SHA256" ] || {
          echo "Installed BGE-M3 manifest is not the qualified release" >&2
          exit 1
        }
    volumes:
      - paperless-ollama-data:/root/.ollama

  paperless-trash-init:
    profiles: ["paperless"]
    image: alpine:3.24.1
    restart: "no"
    command: ["chown", "1000:1000", "/trash"]
    volumes:
      - paperless-trash:/trash

  paperless-webserver:
    profiles: ["paperless"]
    image: ${PAPERLESS_IMAGE:-usl-paperless-ngx:3.0.5-usl.9}
    build:
      context: .
      dockerfile: deploy/documents/paperless-ngx/Dockerfile
      args:
        PAPERLESS_BASE_IMAGE: ${PAPERLESS_BASE_IMAGE:-ghcr.io/paperless-ngx/paperless-ngx@sha256:65a4cabf0169ea7fbd90ab7bb28ba3f8b5909613635acda1a03ad606f34b456b}
    restart: unless-stopped
    depends_on:
      paperless-preflight:
        condition: service_completed_successfully
      paperless-db:
        condition: service_healthy
      paperless-broker:
        condition: service_healthy
      paperless-model-preflight:
        condition: service_completed_successfully
      paperless-trash-init:
        condition: service_completed_successfully
      paperless-gotenberg:
        condition: service_healthy
      paperless-tika:
        condition: service_healthy
    environment:
      USL_DEPLOYMENT_ENV: ${USL_DEPLOYMENT_ENV:-development}
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: ${PAPERLESS_DB_NAME:-paperless}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER:-paperless}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:-paperless-change-me-dev-only}
      PAPERLESS_URL: ${PAPERLESS_PUBLIC_URL:-http://127.0.0.1:8010}
      PAPERLESS_ALLOWED_HOSTS: ${PAPERLESS_ALLOWED_HOSTS:-localhost,127.0.0.1,paperless-webserver}
      PAPERLESS_CORS_ALLOWED_HOSTS: ${PAPERLESS_CORS_ALLOWED_HOSTS:-http://127.0.0.1:8010}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: ${PAPERLESS_CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8010}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-paperless-change-me-dev-only}
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE:-Europe/Paris}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-fra+eng}
      PAPERLESS_TASK_WORKERS: ${PAPERLESS_TASK_WORKERS:-1}
      PAPERLESS_CONSUMER_ENABLE_BARCODES: ${PAPERLESS_CONSUMER_ENABLE_BARCODES:-true}
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "false"
      PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": false}'
      PAPERLESS_EMPTY_TRASH_DELAY: ${PAPERLESS_EMPTY_TRASH_DELAY:-36500}
      PAPERLESS_EMPTY_TRASH_DIR: /usr/src/paperless/trash
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_AI_ENABLED: ${PAPERLESS_AI_ENABLED:-true}
      PAPERLESS_USL_DEFER_SEMANTIC_INDEX: ${PAPERLESS_USL_DEFER_SEMANTIC_INDEX:-false}
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ${PAPERLESS_AI_LLM_EMBEDDING_BACKEND:-ollama}
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: ${PAPERLESS_AI_LLM_EMBEDDING_MODEL:-usl-bge-m3:documents-20260824-rc1}
      PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: ${PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT:-http://paperless-ollama:11434}
      PAPERLESS_AI_LLM_EMBEDDING_CHUNK_SIZE: ${PAPERLESS_AI_LLM_EMBEDDING_CHUNK_SIZE:-512}
      PAPERLESS_AI_LLM_EMBEDDING_BATCH_SIZE: ${PAPERLESS_AI_LLM_EMBEDDING_BATCH_SIZE:-32}
      PAPERLESS_AI_LLM_CONTEXT_SIZE: ${PAPERLESS_AI_LLM_CONTEXT_SIZE:-8192}
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: ${PAPERLESS_AI_LLM_REQUEST_TIMEOUT:-300}
      PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS: "true"
      PAPERLESS_EMAIL_TASK_CRON: ${PAPERLESS_EMAIL_TASK_CRON:-disable}
      PAPERLESS_TRAIN_TASK_CRON: ${PAPERLESS_TRAIN_TASK_CRON:-disable}
      PAPERLESS_SANITY_TASK_CRON: ${PAPERLESS_SANITY_TASK_CRON:-disable}
      PAPERLESS_EMPTY_TRASH_TASK_CRON: ${PAPERLESS_EMPTY_TRASH_TASK_CRON:-disable}
      PAPERLESS_WORKFLOW_SCHEDULED_TASK_CRON: ${PAPERLESS_WORKFLOW_SCHEDULED_TASK_CRON:-disable}
      PAPERLESS_SHARE_LINK_BUNDLE_CLEANUP_CRON: ${PAPERLESS_SHARE_LINK_BUNDLE_CLEANUP_CRON:-disable}
      PAPERLESS_LLM_INDEX_TASK_CRON: ${PAPERLESS_LLM_INDEX_TASK_CRON:-10 2 * * *}
      PAPERLESS_USL_SCOPED_SERVICE_USERS: ${PAPERLESS_USL_SCOPED_SERVICE_USERS:-odoo-integration}
      PAPERLESS_APPS: paperless_personal_ai
      USL_PERSONAL_AI_MASTER_KEYS_PATH: /run/secrets/usl_personal_ai_master_keys
    ports:
      - "127.0.0.1:${PAPERLESS_HTTP_PORT:-8010}:8000"
    secrets:
      - source: usl_personal_ai_master_keys
        target: usl_personal_ai_master_keys
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --header 'Host: paperless-webserver'
          http://127.0.0.1:8000/api/ >/dev/null &&
          for service in svc-webserver svc-worker svc-consumer svc-scheduler;
          do s6-svstat "/run/service/$$service" | grep -q '^up ' || exit 1;
          done
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
      - paperless-trash:/usr/src/paperless/trash

  paperless-access-init:
    profiles: ["paperless-admin"]
    image: ${PAPERLESS_IMAGE:-usl-paperless-ngx:3.0.5-usl.9}
    restart: "no"
    depends_on:
      paperless-webserver:
        condition: service_healthy
    working_dir: /usr/src/paperless/src
    entrypoint: ["/bin/sh", "-ec"]
    command: ["python manage.py shell < /opt/usl/paperless_access_init.py"]
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: ${PAPERLESS_DB_NAME:-paperless}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER:-paperless}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:-paperless-change-me-dev-only}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-paperless-change-me-dev-only}
      PAPERLESS_SSO_BASE_GROUP: ${PAPERLESS_SSO_BASE_GROUP:-USL Odoo document users}
    volumes:
      - ./deploy/documents/paperless_access_init.py:/opt/usl/paperless_access_init.py:ro

  paperless-identity-init:
    profiles: ["paperless-admin"]
    image: ${PAPERLESS_IMAGE:-usl-paperless-ngx:3.0.5-usl.9}
    restart: "no"
    depends_on:
      paperless-webserver:
        condition: service_healthy
    working_dir: /usr/src/paperless/src
    entrypoint: ["/bin/sh", "-ec"]
    command: ["python manage.py shell < /opt/usl/paperless_identity_sync.py"]
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: ${PAPERLESS_DB_NAME:-paperless}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER:-paperless}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:-paperless-change-me-dev-only}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-paperless-change-me-dev-only}
      PAPERLESS_SSO_BASE_GROUP: ${PAPERLESS_SSO_BASE_GROUP:-USL Odoo document users}
      PAPERLESS_OIDC_PROVIDER_ID: pocket-id
      PAPERLESS_IDENTITY_PLAN_JSON: ${PAPERLESS_IDENTITY_PLAN_JSON:-[]}
    volumes:
      - ./deploy/documents/paperless_identity_sync.py:/opt/usl/paperless_identity_sync.py:ro

  paperless-gotenberg:
    profiles: ["paperless"]
    image: ${PAPERLESS_GOTENBERG_IMAGE:-gotenberg/gotenberg:8.36@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466}
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  paperless-tika:
    profiles: ["paperless"]
    image: ${PAPERLESS_TIKA_IMAGE:-apache/tika:3.3.1.0-full}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:9998/tika"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  usl-document-renderer:
    profiles: ["document-renderer"]
    image: ${USL_DOCUMENT_RENDERER_IMAGE:-usl-document-renderer:a01385982eb4}
    build:
      context: services/usl-document-renderer
      args:
        USL_TEMPLATE_REVISION: a01385982eb406947bd1e312a1cefd7fe4636943
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    tmpfs:
      - /tmp:size=128m,mode=1770,uid=10001,gid=10001,noexec,nosuid,nodev
    environment:
      USL_RENDERER_TLS_CERT: /run/secrets/document-renderer/renderer.crt
      USL_RENDERER_TLS_KEY: /run/secrets/document-renderer/renderer.key
      USL_RENDERER_TLS_CLIENT_CA: /run/secrets/document-renderer/ca.crt
      USL_RENDER_CONCURRENCY: "2"
      USL_RENDER_TIMEOUT_SECONDS: "30"
    volumes:
      - ${USL_DOCUMENT_RENDERER_CERT_DIR:-./private/document-renderer-certs}:/run/secrets/document-renderer:ro
    networks:
      - document-renderer

  usl-sign-step-ca:
    profiles: ["sign"]
    image: ${USL_SIGN_STEP_CA_IMAGE:-smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270}
    restart: unless-stopped
    # step-ca includes the authorization token in some error logs. Disable the
    # container log driver; Odoo records the non-sensitive issuance receipt.
    logging:
      driver: "none"
    env_file:
      - path: ${USL_SIGN_STEP_CA_ENV_FILE:-.secrets/sign/step-ca.env}
        required: false
    command:
      - step-ca
      - /home/step/config/ca.json
      - --password-file
      - /home/step/password
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1700
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    # The upstream binary carries this file capability. Keeping only that
    # capability in the bounding set is required for exec, although port 9000
    # itself is unprivileged.
    cap_add: ["NET_BIND_SERVICE"]
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ${USL_SIGN_STEP_CA_DIR:-./.secrets/sign/step-ca}:/home/step

  usl-sign-dss:
    profiles: ["sign"]
    build:
      context: .
      dockerfile: services/usl-sign-dss/Dockerfile
    image: ${USL_SIGN_DSS_IMAGE:-usl-sign-dss:6.4}
    restart: unless-stopped
    env_file:
      - path: ${USL_SIGN_DSS_ENV_FILE:-.secrets/sign/dss.env}
        required: false
    environment:
      USL_DSS_PORT: 8443
      USL_DSS_PLATFORM_KEYSTORE: /run/usl-sign-dss/platform.p12
      USL_DSS_MANIFEST_KEYSTORE: /run/usl-sign-dss/manifest.p12
      USL_DSS_TLS_KEYSTORE: /run/usl-sign-dss/server.p12
      USL_DSS_CLIENT_TRUSTSTORE: /run/usl-sign-dss/client-trust.p12
      USL_DSS_LOCAL_TRUSTSTORE: /run/usl-sign-dss/local-trust.p12
      USL_DSS_LOTL_KEYSTORE: ${USL_DSS_LOTL_KEYSTORE:-}
      USL_DSS_LOTL_KEYSTORE_PASSWORD: ${USL_DSS_LOTL_KEYSTORE_PASSWORD:-}
      USL_DSS_LOTL_URL: ${USL_DSS_LOTL_URL:-}
      USL_DSS_OJ_URL: ${USL_DSS_OJ_URL:-}
      USL_DSS_TSA_URL: ${USL_DSS_TSA_URL:-}
      USL_DSS_TSL_CACHE: /var/cache/usl-sign-dss/tsl
      USL_DSS_PDFA_FONT: /app/NotoSans-Regular.ttf
      USL_DSS_VERAPDF: /opt/verapdf/verapdf
      USL_DSS_PYHANKO_PYTHON: /opt/pyhanko/bin/python
      USL_DSS_PYHANKO_SCRIPT: /app/pyhanko-validate.py
      USL_DSS_PYHANKO_FILL_SCRIPT: /app/pyhanko-fill-fields.py
      USL_DSS_PYHANKO_NORMALIZE_SCRIPT: /app/pyhanko-normalize-xref.py
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1700,uid=100,gid=101
      - /var/cache/usl-sign-dss:size=128m,mode=1700,uid=100,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ${USL_SIGN_DSS_SECRET_DIR:-./.secrets/sign/dss}:/run/usl-sign-dss:ro

  usl-receipt-egress:
    build:
      context: .
      dockerfile: services/usl-receipt-egress/Dockerfile
      args:
        SMOKESCREEN_COMMIT: d4da883a671475551d78da812db547341c8fe6c3
    image: ${USL_RECEIPT_EGRESS_IMAGE:-usl-receipt-egress:d4da883a6714}
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=services/usl-receipt-egress/seccomp_profile.json
    pids_limit: 64
    cpus: 0.50
    mem_limit: 128m
    ulimits:
      nofile:
        soft: 256
        hard: 256
    healthcheck:
      test: ["CMD", "/usr/local/bin/smokescreen", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - receipt-proxy
      - receipt-public

  usl-receipt-fetcher:
    build:
      context: .
      dockerfile: services/usl-receipt-fetcher/Dockerfile
    image: ${USL_RECEIPT_FETCHER_IMAGE:-usl-receipt-fetcher:playwright-1.62.0}
    restart: unless-stopped
    depends_on:
      usl-receipt-egress:
        condition: service_healthy
    environment:
      USL_RECEIPT_EGRESS_PROXY: http://usl-receipt-egress:4750
    read_only: true
    init: true
    tmpfs:
      - /tmp/receipt-fetcher:size=96m,mode=1700,uid=1001,gid=1001,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    # Chromium's Linux namespace sandbox performs its own chroot after dropping
    # privileges. Keep only that capability; all others remain removed.
    cap_add: ["SYS_CHROOT"]
    security_opt:
      - no-new-privileges:true
      - seccomp=services/usl-receipt-fetcher/seccomp_profile.json
    pids_limit: 256
    cpus: 1.50
    mem_limit: 768m
    shm_size: 256m
    ulimits:
      nofile:
        soft: 512
        hard: 512
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ${USL_RECEIPT_FETCHER_SECRET_DIR:-./.secrets/receipts/fetcher}:/run/secrets/receipt-fetcher:ro
      - receipt-control:/run/receipt-control
    networks:
      - receipt-proxy

  odoo:
    image: ${ODOO_IMAGE:-usl-odoo-saas-19-3-odoo:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: base
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ${USL_SIGN_ODOO_ENV_FILE:-.secrets/sign/odoo.env}
        required: false
    environment:
      ODOO_DB_HOST: ${ODOO_DB_HOST:-db}
      ODOO_DB_PORT: ${ODOO_DB_PORT:-5432}
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      ODOO_DB_NAME: ${ODOO_DB_NAME:-}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      ODOO_DB_FILTER: ${ODOO_DB_FILTER:-^odoo_dev$}
      ODOO_HTTP_PORT: 8069
      ODOO_GEVENT_PORT: 8072
      ODOO_HTTP_INTERFACE: ${ODOO_HTTP_INTERFACE:-0.0.0.0}
      ODOO_LIST_DB: ${ODOO_LIST_DB:-True}
      ODOO_PROXY_MODE: ${ODOO_PROXY_MODE:-False}
      ODOO_WORKERS: ${ODOO_WORKERS:-0}
      ODOO_SERVER_WIDE_MODULES: ${ODOO_SERVER_WIDE_MODULES:-web,queue_job}
      ODOO_QUEUE_JOB_CHANNELS: ${ODOO_QUEUE_JOB_CHANNELS:-root:4,root.receipt_fetch:2}
      ODOO_MAX_CRON_THREADS: ${ODOO_MAX_CRON_THREADS:-1}
      ODOO_SMTP_SERVER: ${ODOO_SMTP_SERVER:-localhost}
      ODOO_SMTP_PORT: ${ODOO_SMTP_PORT:-25}
      ODOO_SMTP_SSL: ${ODOO_SMTP_SSL:-False}
      ODOO_SMTP_USER: ${ODOO_SMTP_USER:-}
      ODOO_SMTP_PASSWORD: ${ODOO_SMTP_PASSWORD:-}
      ODOO_EMAIL_FROM: ${ODOO_EMAIL_FROM:-}
      ODOO_FROM_FILTER: ${ODOO_FROM_FILTER:-}
      ODOO_DB_MAXCONN: ${ODOO_DB_MAXCONN:-32}
      ODOO_LIMIT_MEMORY_SOFT: ${ODOO_LIMIT_MEMORY_SOFT:-1073741824}
      ODOO_LIMIT_MEMORY_HARD: ${ODOO_LIMIT_MEMORY_HARD:-1342177280}
      ODOO_LIMIT_REQUEST: ${ODOO_LIMIT_REQUEST:-8192}
      ODOO_ADDONS_PATH: ${ODOO_ADDONS_PATH:-/opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/custom-addons,/mnt/oca-addons}
      USL_USER_DOCS_PATH: ${USL_USER_DOCS_PATH:-/mnt/user-docs}
      USL_EINVOICE_LIVE_ENABLED: ${USL_EINVOICE_LIVE_ENABLED:-0}
      USL_EREPORTING_LIVE_ENABLED: ${USL_EREPORTING_LIVE_ENABLED:-0}
      USL_LINKED_PDF_DOWNLOAD_ENABLED: ${USL_LINKED_PDF_DOWNLOAD_ENABLED:-0}
      USL_LINKED_PDF_DOWNLOAD_ADMITTED: ${USL_LINKED_PDF_DOWNLOAD_ADMITTED:-0}
      USL_RECEIPT_FETCHER_URL: ${USL_RECEIPT_FETCHER_URL:-https://usl-receipt-fetcher}
      USL_RECEIPT_FETCHER_SOCKET: /run/receipt-control/fetcher.sock
      USL_RECEIPT_FETCHER_CERT_DIR: /run/secrets/receipt-fetcher
      USL_DEPLOYMENT_ENV: ${USL_DEPLOYMENT_ENV:-development}
      USL_RELEASE_COMMIT: ${USL_RELEASE_COMMIT:-development}
      USL_MCP_FEEDBACK_PROJECT_ID: ${USL_MCP_FEEDBACK_PROJECT_ID:-17}
      USL_MCP_FEEDBACK_STAGE_ID: ${USL_MCP_FEEDBACK_STAGE_ID:-126}
      PAPERLESS_INTERNAL_URL: ${PAPERLESS_INTERNAL_URL:-http://paperless-webserver:8000}
      USL_POCKET_ID_ENABLED: ${USL_POCKET_ID_ENABLED:-0}
      USL_POCKET_ID_ISSUER: ${USL_POCKET_ID_ISSUER:-}
      USL_POCKET_ID_CLIENT_ID: ${USL_POCKET_ID_CLIENT_ID:-}
      USL_POCKET_ID_CLIENT_SECRET: ${USL_POCKET_ID_CLIENT_SECRET:-}
      USL_POCKET_ID_ODOO_BASE_URL: ${USL_POCKET_ID_ODOO_BASE_URL:-}
      USL_POCKET_ID_REQUIRED_GROUP: ${USL_POCKET_ID_REQUIRED_GROUP:-}
      USL_POCKET_ID_SCOPES: ${USL_POCKET_ID_SCOPES:-openid profile email groups}
      USL_POCKET_ID_TOKEN_AUTH_METHOD: ${USL_POCKET_ID_TOKEN_AUTH_METHOD:-}
      USL_POCKET_ID_ALLOW_UNIQUE_EMAIL_LINK: ${USL_POCKET_ID_ALLOW_UNIQUE_EMAIL_LINK:-0}
      USL_POCKET_ID_SIGN_CLIENT_ID: ${USL_POCKET_ID_SIGN_CLIENT_ID:-}
      USL_POCKET_ID_SIGN_CLIENT_SECRET: ${USL_POCKET_ID_SIGN_CLIENT_SECRET:-}
      USL_POCKET_ID_SIGN_REQUIRED_GROUP: ${USL_POCKET_ID_SIGN_REQUIRED_GROUP:-}
      USL_POCKET_ID_SIGN_FRESH_REQUIRED: ${USL_POCKET_ID_SIGN_FRESH_REQUIRED:-0}
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
      - "${ODOO_GEVENT_PORT:-8072}:8072"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/health?db_server_status=1', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - odoo-data:/var/lib/odoo
      - ./custom-addons:/mnt/custom-addons
      - ./oca-src:/mnt/oca-src:ro
      - ./oca-addons:/mnt/oca-addons:ro
      - ./docs/users:/mnt/user-docs:ro
      - ${USL_DOCUMENT_RENDERER_CERT_DIR:-./private/document-renderer-certs}:/run/secrets/document-renderer:ro
      - ./scripts/sign-services-smoke.py:/usr/local/bin/usl-sign-services-smoke:ro
      - ${USL_SIGN_ODOO_SECRET_DIR:-./.secrets/sign/odoo}:/run/usl-sign:ro
      - ${USL_RECEIPT_ODOO_SECRET_DIR:-./.secrets/receipts/odoo}:/run/secrets/receipt-fetcher:ro
      - receipt-control:/run/receipt-control:ro
    networks:
      - default
      - document-renderer

  odoo-mcp-oauth-init:
    profiles: ["mcp"]
    image: ${ODOO_MCP_IMAGE:-usl-odoo-mcp@sha256:9ea7c1b2ed5a27b7762cc98e83e403757e7dfbd717ce64dfd775484b98fdfc7a}
    restart: "no"
    environment: *odoo-mcp-environment
    command: ["node", "dist/auth/cli.js", "migrate"]
    secrets:
      - odoo_mcp_better_auth_secret
      - odoo_mcp_credential_encryption_key
    volumes:
      - odoo-mcp-oauth-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1700,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  odoo-mcp:
    profiles: ["mcp"]
    image: ${ODOO_MCP_IMAGE:-usl-odoo-mcp@sha256:9ea7c1b2ed5a27b7762cc98e83e403757e7dfbd717ce64dfd775484b98fdfc7a}
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
      odoo-mcp-oauth-init:
        condition: service_completed_successfully
    environment: *odoo-mcp-environment
    secrets:
      - odoo_mcp_better_auth_secret
      - odoo_mcp_credential_encryption_key
    volumes:
      - odoo-mcp-oauth-data:/data
    ports:
      - "127.0.0.1:${ODOO_MCP_HTTP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1700,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get({hostname: '127.0.0.1', port: 3000, path: '/readyz',
          headers: {host: process.env.MCP_HEALTHCHECK_HOST}}, response => {
            let body = ''; response.on('data', chunk => body += chunk);
            response.on('end', () => {
              try { if (response.statusCode !== 200 || JSON.parse(body).status !== 'ready') process.exit(1); }
              catch (_) { process.exit(1); }
            });
          }).on('error', () => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      org.opencontainers.image.source: https://github.com/unstaticlabs/odoo-mcp.git
      org.opencontainers.image.revision: ${ODOO_MCP_RELEASE_COMMIT:-d6ef1e507af75f8ab4d295c52a0c3ce86821cabd}

  init-db:
    profiles: ["init"]
    image: ${ODOO_IMAGE:-usl-odoo-saas-19-3-odoo:latest}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ${USL_SIGN_ODOO_ENV_FILE:-.secrets/sign/odoo.env}
        required: false
    environment:
      ODOO_DB_HOST: ${ODOO_DB_HOST:-db}
      ODOO_DB_PORT: ${ODOO_DB_PORT:-5432}
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
