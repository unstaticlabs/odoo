      USL_POCKET_ID_SCOPES: ${USL_POCKET_ID_SCOPES:-openid profile email groups}
      USL_POCKET_ID_TOKEN_AUTH_METHOD: ${USL_POCKET_ID_TOKEN_AUTH_METHOD:-}
      USL_POCKET_ID_ALLOW_UNIQUE_EMAIL_LINK: ${USL_POCKET_ID_ALLOW_UNIQUE_EMAIL_LINK:-0}
      USL_POCKET_ID_SIGN_CLIENT_ID: ${USL_POCKET_ID_SIGN_CLIENT_ID:-}
      USL_POCKET_ID_SIGN_CLIENT_SECRET: ${USL_POCKET_ID_SIGN_CLIENT_SECRET:-}
      USL_POCKET_ID_SIGN_REQUIRED_GROUP: ${USL_POCKET_ID_SIGN_REQUIRED_GROUP:-}
      USL_POCKET_ID_SIGN_FRESH_REQUIRED: ${USL_POCKET_ID_SIGN_FRESH_REQUIRED:-0}
    restart: "no"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./custom-addons:/mnt/custom-addons
      - ./migration/accounting_restore/addons:/mnt/accounting-migration-addons:ro
      - ./migration/identity_restore/addons:/mnt/identity-migration-addons:ro
      - ./migration/product_restore/addons:/mnt/product-migration-addons:ro
      - ./migration/b2c_restore/addons:/mnt/b2c-migration-addons:ro
      - ./migration/hr_restore/addons:/mnt/hr-migration-addons:ro
      - ./migration/project_restore/addons:/mnt/project-migration-addons:ro
      - ./migration/tese_restore/addons:/mnt/tese-migration-addons:ro
      - ./migration/platform_billing_restore/addons:/mnt/platform-billing-migration-addons:ro
      - ./migration/collaboration_restore/addons:/mnt/collaboration-migration-addons:ro
      - ./oca-src:/mnt/oca-src:ro
      - ./oca-addons:/mnt/oca-addons:ro
      - ./docs/users:/mnt/user-docs:ro
      - ${USL_DOCUMENT_RENDERER_CERT_DIR:-./private/document-renderer-certs}:/run/secrets/document-renderer:ro
      - ${USL_SIGN_ODOO_SECRET_DIR:-./.secrets/sign/odoo}:/run/usl-sign:ro
    networks:
      - default
      - document-renderer

  devcontainer:
    profiles: ["devcontainer"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ODOO_DB_HOST: ${ODOO_DB_HOST:-db}
      ODOO_DB_PORT: ${ODOO_DB_PORT:-5432}
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      ODOO_DATA_DIR: /var/lib/odoo
      ODOO_HTTP_INTERFACE: ${ODOO_HTTP_INTERFACE:-0.0.0.0}
      ODOO_MAX_CRON_THREADS: 0
      ODOO_ADDONS_PATH: /workspace/odoo/addons,/workspace/odoo/odoo/addons,/workspace/odoo/custom-addons,/workspace/odoo/oca-addons
      ODOO_DEV_MODE: ${ODOO_DEV_MODE:-reload,xml,qweb}
      USL_USER_DOCS_PATH: ${USL_USER_DOCS_PATH:-/workspace/odoo/docs/users}
      USL_EINVOICE_LIVE_ENABLED: ${USL_EINVOICE_LIVE_ENABLED:-0}
      USL_POCKET_ID_ENABLED: ${USL_POCKET_ID_ENABLED:-0}
      USL_POCKET_ID_ISSUER: ${USL_POCKET_ID_ISSUER:-}
      USL_POCKET_ID_CLIENT_ID: ${USL_POCKET_ID_CLIENT_ID:-}
      USL_POCKET_ID_CLIENT_SECRET: ${USL_POCKET_ID_CLIENT_SECRET:-}
      USL_POCKET_ID_ODOO_BASE_URL: ${USL_POCKET_ID_ODOO_BASE_URL:-}
      USL_POCKET_ID_REQUIRED_GROUP: ${USL_POCKET_ID_REQUIRED_GROUP:-}
      USL_POCKET_ID_SCOPES: ${USL_POCKET_ID_SCOPES:-openid profile email groups}
      USL_POCKET_ID_TOKEN_AUTH_METHOD: ${USL_POCKET_ID_TOKEN_AUTH_METHOD:-}
      USL_POCKET_ID_ALLOW_UNIQUE_EMAIL_LINK: ${USL_POCKET_ID_ALLOW_UNIQUE_EMAIL_LINK:-0}
      USL_EREPORTING_LIVE_ENABLED: ${USL_EREPORTING_LIVE_ENABLED:-0}
    command: sleep infinity
    volumes:
      - .:/workspace/odoo:cached
      - odoo-dev-home:/home/odoo
      - odoo-data:/var/lib/odoo
volumes:
  postgres-data:
  accounting-source-postgres-data:
  odoo-data:
  odoo-dev-home:
  paperless-postgres-data:
  paperless-broker-data:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:
  paperless-trash:
  paperless-ollama-data:
  odoo-mcp-oauth-data:
  receipt-control:

networks:
  document-renderer:
    internal: true
  receipt-proxy:
    internal: true
  receipt-public:

secrets:
  usl_personal_ai_master_keys:
    file: ${USL_PERSONAL_AI_MASTER_KEYS_HOST_PATH:-.documents-personal-ai-keys.json}
  odoo_mcp_better_auth_secret:
    file: ${ODOO_MCP_BETTER_AUTH_SECRET_FILE:-./private/odoo-mcp-better-auth.secret}
  odoo_mcp_credential_encryption_key:
    file: ${ODOO_MCP_CREDENTIAL_ENCRYPTION_KEY_FILE:-./private/odoo-mcp-credential-encryption-key.secret}
