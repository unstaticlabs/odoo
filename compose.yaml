name: ${COMPOSE_PROJECT_NAME:-usl-odoo-saas-19-2}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  accounting-source-db:
    profiles: ["accounting-compat"]
    image: ${ACCOUNTING_SOURCE_POSTGRES_IMAGE:-pgvector/pgvector:pg16-bookworm}
    restart: "no"
    environment:
      POSTGRES_DB: ${ACCOUNTING_SOURCE_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${ACCOUNTING_SOURCE_POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${ACCOUNTING_SOURCE_POSTGRES_PASSWORD:-odoo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - accounting-source-postgres-data:/var/lib/postgresql/data

  paperless-db:
    profiles: ["paperless"]
    image: ${PAPERLESS_POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAPERLESS_DB_NAME:-paperless}
      POSTGRES_USER: ${PAPERLESS_DB_USER:-paperless}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:-paperless-change-me-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - paperless-postgres-data:/var/lib/postgresql/data

  paperless-broker:
    profiles: ["paperless"]
    image: ${PAPERLESS_BROKER_IMAGE:-valkey/valkey:8.1.3-alpine}
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - paperless-broker-data:/data

  paperless-webserver:
    profiles: ["paperless"]
    image: ${PAPERLESS_IMAGE:-ghcr.io/paperless-ngx/paperless-ngx:3.0.4}
    restart: unless-stopped
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-broker:
        condition: service_healthy
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: ${PAPERLESS_DB_NAME:-paperless}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER:-paperless}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:-paperless-change-me-dev-only}
      PAPERLESS_URL: ${PAPERLESS_PUBLIC_URL:-http://127.0.0.1:8010}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-paperless-change-me-dev-only}
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE:-Europe/Paris}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-fra+eng}
      PAPERLESS_CONSUMER_ENABLE_BARCODES: ${PAPERLESS_CONSUMER_ENABLE_BARCODES:-true}
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "false"
      PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": false}'
      PAPERLESS_TIKA_ENABLED: "0"
    ports:
      - "127.0.0.1:${PAPERLESS_HTTP_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume

  odoo:
    image: ${ODOO_IMAGE:-usl-odoo-saas-19-2-odoo:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: base
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ODOO_DB_HOST: ${ODOO_DB_HOST:-db}
      ODOO_DB_PORT: ${ODOO_DB_PORT:-5432}
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      ODOO_HTTP_PORT: 8069
      ODOO_GEVENT_PORT: 8072
      ODOO_HTTP_INTERFACE: ${ODOO_HTTP_INTERFACE:-0.0.0.0}
      ODOO_MAX_CRON_THREADS: ${ODOO_MAX_CRON_THREADS:-1}
      ODOO_DB_FILTER: ${ODOO_DB_FILTER:-^odoo_dev$}
      ODOO_ADDONS_PATH: ${ODOO_ADDONS_PATH:-/opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/custom-addons,/mnt/oca-addons}
      USL_USER_DOCS_PATH: ${USL_USER_DOCS_PATH:-/mnt/user-docs}
      USL_EINVOICE_LIVE_ENABLED: ${USL_EINVOICE_LIVE_ENABLED:-0}
      USL_EREPORTING_LIVE_ENABLED: ${USL_EREPORTING_LIVE_ENABLED:-0}
      PAPERLESS_INTERNAL_URL: ${PAPERLESS_INTERNAL_URL:-http://paperless-webserver:8000}
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
      - "${ODOO_GEVENT_PORT:-8072}:8072"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/health?db_server_status=1', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - odoo-data:/var/lib/odoo
      - ./custom-addons:/mnt/custom-addons
      - ./oca-src:/mnt/oca-src:ro
      - ./oca-addons:/mnt/oca-addons:ro
      - ./docs/users:/mnt/user-docs:ro

  init-db:
    profiles: ["init"]
    image: ${ODOO_IMAGE:-usl-odoo-saas-19-2-odoo:latest}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ODOO_DB_HOST: ${ODOO_DB_HOST:-db}
      ODOO_DB_PORT: ${ODOO_DB_PORT:-5432}
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      ODOO_HTTP_INTERFACE: ${ODOO_HTTP_INTERFACE:-0.0.0.0}
      ODOO_MAX_CRON_THREADS: 0
      ODOO_ADDONS_PATH: ${ODOO_ADDONS_PATH:-/opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/custom-addons,/mnt/oca-addons}
      USL_USER_DOCS_PATH: ${USL_USER_DOCS_PATH:-/mnt/user-docs}
      USL_EINVOICE_LIVE_ENABLED: ${USL_EINVOICE_LIVE_ENABLED:-0}
      USL_EREPORTING_LIVE_ENABLED: ${USL_EREPORTING_LIVE_ENABLED:-0}
    command:
      - odoo
      - --config=/etc/odoo/odoo.conf
      - --database=${ODOO_INIT_DB:-odoo_dev}
      - --init=${ODOO_INIT_MODULES:-rebuild_account_migration}
      - --without-demo=true
      - --stop-after-init
    restart: "no"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./custom-addons:/mnt/custom-addons
      - ./oca-src:/mnt/oca-src:ro
      - ./oca-addons:/mnt/oca-addons:ro
      - ./docs/users:/mnt/user-docs:ro
      - ./usl-online-dump:/mnt/accounting-source:ro

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ODOO_DB_HOST: ${ODOO_DB_HOST:-db}
      ODOO_DB_PORT: ${ODOO_DB_PORT:-5432}
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      ODOO_HTTP_INTERFACE: ${ODOO_HTTP_INTERFACE:-0.0.0.0}
      ODOO_MAX_CRON_THREADS: 0
      ODOO_ADDONS_PATH: ${ODOO_ADDONS_PATH:-/opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/custom-addons,/mnt/oca-addons}
      USL_USER_DOCS_PATH: ${USL_USER_DOCS_PATH:-/mnt/user-docs}
      USL_EINVOICE_LIVE_ENABLED: ${USL_EINVOICE_LIVE_ENABLED:-0}
      USL_EREPORTING_LIVE_ENABLED: ${USL_EREPORTING_LIVE_ENABLED:-0}
    restart: "no"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./custom-addons:/mnt/custom-addons
      - ./oca-src:/mnt/oca-src:ro
      - ./oca-addons:/mnt/oca-addons:ro
      - ./docs/users:/mnt/user-docs:ro

  devcontainer:
    profiles: ["devcontainer"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ODOO_DB_HOST: ${ODOO_DB_HOST:-db}
      ODOO_DB_PORT: ${ODOO_DB_PORT:-5432}
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      ODOO_DATA_DIR: /var/lib/odoo
      ODOO_HTTP_INTERFACE: ${ODOO_HTTP_INTERFACE:-0.0.0.0}
      ODOO_MAX_CRON_THREADS: 0
      ODOO_ADDONS_PATH: /workspace/odoo/addons,/workspace/odoo/odoo/addons,/workspace/odoo/custom-addons,/workspace/odoo/oca-addons
      ODOO_DEV_MODE: ${ODOO_DEV_MODE:-reload,xml,qweb}
      USL_USER_DOCS_PATH: ${USL_USER_DOCS_PATH:-/workspace/odoo/docs/users}
      USL_EINVOICE_LIVE_ENABLED: ${USL_EINVOICE_LIVE_ENABLED:-0}
      USL_EREPORTING_LIVE_ENABLED: ${USL_EREPORTING_LIVE_ENABLED:-0}
    command: sleep infinity
    volumes:
      - .:/workspace/odoo:cached
      - odoo-dev-home:/home/odoo
      - odoo-data:/var/lib/odoo
volumes:
  postgres-data:
  accounting-source-postgres-data:
  odoo-data:
  odoo-dev-home:
  paperless-postgres-data:
  paperless-broker-data:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:
