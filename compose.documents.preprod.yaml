services:
  odoo:
    # Pre-production deploys the qualified registry artifact. It must never
    # rebuild an unreviewed image from whichever source tree happens to be
    # present on the host.
    build: !reset null
    ports: !override
      - "127.0.0.1:${ODOO_HTTP_PORT}:8069"
      - "127.0.0.1:${ODOO_GEVENT_PORT}:8072"

  paperless-webserver:
    ports: !override
      - "127.0.0.1:${PAPERLESS_HTTP_PORT}:8000"
