services:
  odoo:
    # Pre-production deploys the qualified registry artifact. It must never
    # rebuild an unreviewed image from whichever source tree happens to be
    # present on the host.
    build: !reset null
    environment:
      ODOO_ADDONS_PATH: /opt/odoo/addons,/opt/odoo/odoo/addons,/opt/usl/custom-addons,/opt/usl/oca-addons
      USL_USER_DOCS_PATH: /opt/usl/user-docs
    ports: !override
      - "127.0.0.1:${ODOO_HTTP_PORT}:8069"
      - "127.0.0.1:${ODOO_GEVENT_PORT}:8072"
    volumes: !override
      - odoo-data:/var/lib/odoo
      - ${USL_DOCUMENT_RENDERER_CERT_DIR:-./private/document-renderer-certs}:/run/secrets/document-renderer:ro
      - ${USL_SIGN_ODOO_SECRET_DIR:-./.secrets/sign/odoo}:/run/usl-sign:ro

  init-db:
    environment:
      ODOO_ADDONS_PATH: /opt/odoo/addons,/opt/odoo/odoo/addons,/opt/usl/custom-addons,/opt/usl/oca-addons
      USL_USER_DOCS_PATH: /opt/usl/user-docs
    volumes: !override
      - odoo-data:/var/lib/odoo
      - ${USL_DOCUMENT_RENDERER_CERT_DIR:-./private/document-renderer-certs}:/run/secrets/document-renderer:ro
      - ${USL_SIGN_ODOO_SECRET_DIR:-./.secrets/sign/odoo}:/run/usl-sign:ro

  paperless-webserver:
    build: !reset null
    ports: !override
      - "127.0.0.1:${PAPERLESS_HTTP_PORT}:8000"
