name: USL qualification

on:
  push:
    branches: [19-usl, 19-usl-staging]
  pull_request:
    branches: [19-usl, 19-usl-staging]
  merge_group:

permissions:
  contents: read

concurrency:
  group: usl-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    name: USL source policy
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == '19-usl') ||
      (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/19-usl')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce protected-branch source policy
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          base="${BASE_REF#refs/heads/}"
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100" \
              > associated-pulls.json
            scripts/check-release-source-policy \
              --event merge_group \
              --base "$base" \
              --pull-requests associated-pulls.json \
              --expected-repository "$EXPECTED_REPOSITORY"
          else
            scripts/check-release-source-policy \
              --event pull_request \
              --base "$base" \
              --head "$HEAD_REF" \
              --head-repository "$HEAD_REPOSITORY" \
              --expected-repository "$EXPECTED_REPOSITORY"
          fi

  compatibility:
    name: USL compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.13"
      - name: Resolve pinned OCA sources
        run: scripts/sync-oca-addons
      - name: Validate source, contracts, governance, XML and migrations
        run: |
          python3 -m compileall -q operations scripts custom-addons
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          make product-migration-source-boundary
          make action-risk-inventory
          scripts/check-github-governance
          find custom-addons -name '*.xml' -print0 | xargs -0 -n1 python3 -c 'import sys,xml.etree.ElementTree as E; E.parse(sys.argv[1])'
          git diff --check

  database:
    name: Clean install and repeated upgrade
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/19-usl-staging') ||
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == '19-usl')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      ODOO_TEST_IMAGE: usl-odoo:test-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch exact comparison base
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Resolve pinned OCA sources
        run: scripts/sync-oca-addons
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build and load the qualified test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: test
          load: true
          tags: ${{ env.ODOO_TEST_IMAGE }}
          cache-from: type=gha,scope=usl-odoo-test
          cache-to: type=gha,scope=usl-odoo-test,mode=max
      - name: Qualify the canonical product database with the loaded image
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test_modules="$(scripts/qualification-test-plan --all)"
          else
            test_modules="$(scripts/qualification-test-plan --base "$BASE_SHA" --head "$GITHUB_SHA")"
          fi
          USL_USE_PREBUILT_TEST_IMAGE=1 \
            USL_TEST_MODULES="$test_modules" \
            ODOO_TEST_IMAGE="$ODOO_TEST_IMAGE" \
            scripts/ci-product-database

  result:
    name: USL qualification
    if: always()
    needs: [source-policy, compatibility, database]
    runs-on: ubuntu-latest
    outputs:
      evidence_sha256: ${{ steps.evidence.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            operations
            scripts/qualification-evidence
      - name: Require the event-specific qualification results
        env:
          SOURCE_POLICY: ${{ needs.source-policy.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          DATABASE: ${{ needs.database.result }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref }}
        run: |
          test "$COMPATIBILITY" = success
          base="${BASE_REF#refs/heads/}"
          if [ "$base" = 19-usl ] && { [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_EVENT_NAME" = merge_group ]; }; then
            test "$SOURCE_POLICY" = success
          else
            test "$SOURCE_POLICY" = skipped
          fi
          if { [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/19-usl-staging ]; } || \
             { [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$base" = 19-usl ]; }; then
            test "$DATABASE" = success
          else
            test "$DATABASE" = skipped
          fi
      - name: Create immutable qualification evidence
        id: evidence
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_POLICY: ${{ needs.source-policy.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          DATABASE: ${{ needs.database.result }}
        run: |
          database_mode=skipped
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "${BASE_REF#refs/heads/}" = 19-usl ]; then
            database_mode=all
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/19-usl-staging ]; then
            database_mode=focused
          fi
          qualified_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          arguments=()
          [ -z "$PR_NUMBER" ] || arguments+=(--pull-request-number "$PR_NUMBER")
          scripts/qualification-evidence create \
            --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" \
            --source-ref "$SOURCE_REF" \
            --source-sha "$SOURCE_SHA" \
            --base-ref "${BASE_REF#refs/heads/}" \
            --base-sha "$BASE_SHA" \
            --qualified-commit "$GITHUB_SHA" \
            --qualified-tree "$qualified_tree" \
            --database-mode "$database_mode" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --result "source_policy=$SOURCE_POLICY" \
            --result "compatibility=$COMPATIBILITY" \
            --result "database=$DATABASE" \
            "${arguments[@]}" \
            --output qualification-evidence.json
          echo "sha256=$(sha256sum qualification-evidence.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == '19-usl' && format('production-qualification-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('qualification-{0}', github.run_id) }}
          path: qualification-evidence.json
          if-no-files-found: error
          retention-days: 30

  production-promotion:
    name: USL production promotion
    if: >-
      always() &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.base.ref == '19-usl') ||
        (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/19-usl')
      )
    needs: result
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Require successful event qualification
        env:
          QUALIFICATION: ${{ needs.result.result }}
        run: test "$QUALIFICATION" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            operations
            scripts/qualification-evidence
      - name: Resolve exact PR qualification evidence
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100" \
              > associated-pulls.json
            test "$(jq 'length' associated-pulls.json)" = 1
            PR_NUMBER="$(jq -r '.[0].number' associated-pulls.json)"
            PR_HEAD_SHA="$(jq -r '.[0].head.sha' associated-pulls.json)"
            PR_HEAD_REF="$(jq -r '.[0].head.ref' associated-pulls.json)"
          else
            PR_HEAD_REF="$EVENT_HEAD_REF"
          fi
          printf '%s\n' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'
          printf '%s\n' "$PR_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          name="production-qualification-$PR_NUMBER-$PR_HEAD_SHA"
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          test -f evidence/qualification-evidence.json
          {
            echo "pr_number=$PR_NUMBER"
            echo "pr_head_sha=$PR_HEAD_SHA"
            echo "pr_head_ref=$PR_HEAD_REF"
          } >> "$GITHUB_OUTPUT"
      - name: Bind the PR-qualified tree to this event
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.source.outputs.pr_head_sha }}
          PR_HEAD_REF: ${{ steps.source.outputs.pr_head_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$PR_HEAD_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            qualified_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
            scripts/qualification-evidence verify-pr \
              --repository "$GITHUB_REPOSITORY" \
              --pull-request-number "$PR_NUMBER" \
              --source-ref "$PR_HEAD_REF" \
              --source-sha "$PR_HEAD_SHA" \
              --base-sha "$BASE_SHA" \
              --qualified-tree "$qualified_tree" \
              --evidence evidence/qualification-evidence.json
          else
            merge_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
            scripts/qualification-evidence verify-merge-group \
              --repository "$GITHUB_REPOSITORY" \
              --pull-request-number "$PR_NUMBER" \
              --source-ref "$PR_HEAD_REF" \
              --source-sha "$PR_HEAD_SHA" \
              --qualified-tree "$merge_tree" \
              --evidence evidence/qualification-evidence.json
          fi

  publish:
    if: github.event_name == 'push' && needs.result.result == 'success'
    needs: result
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/product-image.yml
    with:
      source_ref: ${{ github.ref }}
      source_commit: ${{ github.sha }}
      qualification_evidence_sha256: ${{ needs.result.outputs.evidence_sha256 }}
      qualification_run_id: ${{ fromJSON(github.run_id) }}
    secrets: inherit
