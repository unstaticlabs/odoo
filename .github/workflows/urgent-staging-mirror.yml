name: Mirror urgent fixes to staging

on:
  pull_request:
    branches: [19-usl]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  mirror:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'urgent/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Ensure matching staging PR exists
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base 19-usl-staging --head "$HEAD_BRANCH" --state all --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base 19-usl-staging --head "$HEAD_BRANCH" \
              --title "chore(release): mirror urgent fix #$SOURCE_PR to staging" \
              --body "Automatically mirrors urgent production PR #$SOURCE_PR so the integration branch cannot lose the fix."
          fi
