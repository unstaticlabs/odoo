name: Agent process

on:
  pull_request:
    branches:
      - 19-usl
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate repository agent infrastructure
        run: |
          scripts/agent/verify repository
          python3 -m unittest discover -s scripts/tests -p 'test_agent_*.py'

      - name: Validate PR branch and commit attribution
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          scripts/agent/verify pr-event "$GITHUB_EVENT_PATH"
          scripts/agent/verify commits --base "origin/${{ github.base_ref }}"

      - name: Validate structured Feature handoff
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: scripts/agent/handoff validate-pr-event "$GITHUB_EVENT_PATH"

      - name: Explain Dependabot contract boundary
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: |
          echo "Dependabot is exempt only from Coding Agent attribution and handoff metadata."
          echo "Repository contracts and Distribution image qualification remain mandatory."

      - name: Explain transition enforcement
        run: |
          python3 - <<'PY'
          import json
          import os

          policy = json.load(open("agent/policy.json", encoding="utf-8"))
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as stream:
              stream.write(f"## Agent process policy\n\nPhase: `{policy['workflow_phase']}`\n\n")
              for name, mode in policy["enforcement"].items():
                  stream.write(f"- `{name}`: `{mode}`\n")
              if "advisory" in policy["enforcement"].values():
                  stream.write("\nAdvisory findings are reported but do not block during migration transition.\n")
          PY
