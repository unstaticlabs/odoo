name: Back-merge production into staging

on:
  push:
    branches: [19-usl]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# `contents: write` is deliberate and is the only workflow here that needs it.
# Enabling auto-merge (enablePullRequestAutoMerge) requires write access to the
# repository, and without it the run opens the back-merge pull request and then
# cannot queue it, leaving 19-usl-staging behind 19-usl until somebody merges by
# hand. The token still cannot bypass the ruleset on either release branch: the
# merge queue and the required checks decide when the pull request lands.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: staging-back-merge
  cancel-in-progress: false

jobs:
  back-merge:
    name: Back-merge production into staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Open the back-merge pull request when staging is behind
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/back-merge-production
