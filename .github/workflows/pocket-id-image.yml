# Build, test and publish the patched Pocket ID image (services/usl-pocket-id).
#
# Pocket ID is the identity provider for every USL client, so it is released
# on its own and never through the Odoo distribution release. This workflow
# only publishes an immutable image; production adopts it when the gitops
# Pocket ID stack is changed to that digest.
name: Pocket ID image

on:
  push:
    branches: [19-usl]
    paths:
      - services/usl-pocket-id/**
      - .github/workflows/pocket-id-image.yml
  pull_request:
    paths:
      - services/usl-pocket-id/**
      - .github/workflows/pocket-id-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-id-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/unstaticlabs/usl-pocket-id
  TAG: 2.19.2-usl1

jobs:
  image:
    name: Build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Run the patched Pocket ID tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: services/usl-pocket-id/Dockerfile
          target: backend-test
          platforms: linux/amd64
          push: false

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: services/usl-pocket-id/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}

      - name: Attest the image
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Report the digest to pin in gitops
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf '### Pocket ID image\n\n`%s:%s@%s`\n' "$IMAGE" "$TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
