# Build and publish the self-contained product image (Dockerfile `product`
# stage) to GHCR, pinned by commit SHA. Deployment stacks (Komodo/Compose)
# pull this artifact and must never rebuild it on the host.
name: Product image

on:
  push:
    branches:
      - 19-usl
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: product-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync pinned OCA add-ons
        run: scripts/sync-oca-addons

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/unstaticlabs/usl-odoo
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch

      - name: Build and push product image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: product
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
