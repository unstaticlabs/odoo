# Publish the production Distribution image exactly once after a commit lands
# on 19-usl. Pull requests are qualified before merge; GitHub does not rebuild
# the product for candidate branches.
name: Distribution image

on:
  push:
    branches:
      - 19-usl

permissions:
  contents: read

concurrency:
  group: distribution-image-${{ github.ref }}
  cancel-in-progress: false

env:
  DISTRIBUTION_IMAGE: ghcr.io/unstaticlabs/usl-odoo
  BACKUP_TOOL_IMAGE: ghcr.io/unstaticlabs/usl-odoo-backup
  PAPERLESS_IMAGE: ghcr.io/unstaticlabs/usl-paperless-ngx
  DOCUMENT_RENDERER_IMAGE: ghcr.io/unstaticlabs/usl-document-renderer
  SIGN_DSS_IMAGE: ghcr.io/unstaticlabs/usl-sign-dss

jobs:
  publish:
    name: Publish immutable Distribution image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image: ${{ steps.release.outputs.image }}
      tag: ${{ steps.release.outputs.tag }}
      digest: ${{ steps.release.outputs.digest }}
      digest_reference: ${{ steps.release.outputs.digest_reference }}
      metadata_artifact: ${{ steps.metadata.outputs.artifact_name }}
      backup_tool_image: ${{ steps.backup-release.outputs.image }}
      backup_tool_tag: ${{ steps.backup-release.outputs.tag }}
      backup_tool_digest: ${{ steps.backup-release.outputs.digest }}
      backup_tool_digest_reference: ${{ steps.backup-release.outputs.digest_reference }}
      paperless_digest_reference: ${{ steps.aux-release.outputs.paperless_digest_reference }}
      document_renderer_digest_reference: ${{ steps.aux-release.outputs.renderer_digest_reference }}
      sign_dss_digest_reference: ${{ steps.aux-release.outputs.sign_dss_digest_reference }}
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Checkout pinned Odoo MCP release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: unstaticlabs/odoo-mcp
          ref: codex/odoo-mcp-vps-refactor
          path: .release/odoo-mcp
          persist-credentials: false

      - name: Verify Odoo–MCP compatibility contract
        run: scripts/odoo-mcp verify --repository "$GITHUB_WORKSPACE/.release/odoo-mcp"

      - name: Sync pinned OCA add-ons
        run: scripts/sync-oca-addons

      - name: Resolve release build identity
        id: identity
        run: |
          oca_digest="$(PYTHONPATH=. python3 -c 'from migration.release_identity import oca_bundle_sha256; print(oca_bundle_sha256())')"
          action_risk_digest="$(PYTHONPATH=. python3 -c 'from migration.release_identity import action_risk_policy_sha256; print(action_risk_policy_sha256())')"
          echo "oca_digest=$oca_digest" >> "$GITHUB_OUTPUT"
          echo "action_risk_digest=$action_risk_digest" >> "$GITHUB_OUTPUT"
          echo "renderer_commit=$(git -C services/usl-document-renderer rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the separately published MCP image
        run: |
          mcp_image="$(jq -r .image_digest deploy/odoo-mcp/release.json)"
          docker pull "$mcp_image"
          scripts/odoo-mcp verify-image --repository "$GITHUB_WORKSPACE/.release/odoo-mcp"

      - name: Reuse only an identical existing commit image
        id: existing
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_OCA: ${{ steps.identity.outputs.oca_digest }}
          EXPECTED_ACTION_RISK: ${{ steps.identity.outputs.action_risk_digest }}
        run: |
          reference="$DISTRIBUTION_IMAGE:$IMAGE_TAG"
          set +e
          inspection="$(docker buildx imagetools inspect "$reference" 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if printf '%s' "$inspection" | grep -Eqi 'manifest unknown|name unknown|not found|404'; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf 'Unable to inspect %s:\n%s\n' "$reference" "$inspection" >&2
            exit "$status"
          fi
          docker pull "$reference"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_COMMIT"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "com.unstaticlabs.odoo.oca-bundle-sha256"}}')" = "$EXPECTED_OCA"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "com.unstaticlabs.odoo.action-risk-policy-sha256"}}')" = "$EXPECTED_ACTION_RISK"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "com.unstaticlabs.odoo.runtime"}}')" = distribution
          digest_reference="$(docker image inspect "$reference" --format '{{index .RepoDigests 0}}')"
          digest="${digest_reference#*@}"
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Existing image has no valid digest" >&2
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build and push Distribution image once
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: distribution
          push: true
          tags: ${{ env.DISTRIBUTION_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            USL_RELEASE_COMMIT=${{ github.sha }}
            USL_OCA_BUNDLE_SHA256=${{ steps.identity.outputs.oca_digest }}
            USL_ACTION_RISK_POLICY_SHA256=${{ steps.identity.outputs.action_risk_digest }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=distribution
          cache-to: type=gha,mode=max,scope=distribution

      - name: Resolve immutable image digest
        id: release
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Build produced no valid sha256 digest" >&2
            exit 1
          fi
          echo "image=$DISTRIBUTION_IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "digest_reference=$DISTRIBUTION_IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Verify immutable Distribution labels and digest
        env:
          DIGEST_REFERENCE: ${{ steps.release.outputs.digest_reference }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_OCA: ${{ steps.identity.outputs.oca_digest }}
          EXPECTED_ACTION_RISK: ${{ steps.identity.outputs.action_risk_digest }}
        run: |
          docker pull "$DIGEST_REFERENCE"
          test "$(docker image inspect "$DIGEST_REFERENCE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_COMMIT"
          test "$(docker image inspect "$DIGEST_REFERENCE" --format '{{index .Config.Labels "com.unstaticlabs.odoo.oca-bundle-sha256"}}')" = "$EXPECTED_OCA"
          test "$(docker image inspect "$DIGEST_REFERENCE" --format '{{index .Config.Labels "com.unstaticlabs.odoo.action-risk-policy-sha256"}}')" = "$EXPECTED_ACTION_RISK"
          test "$(docker image inspect "$DIGEST_REFERENCE" --format '{{index .Config.Labels "com.unstaticlabs.odoo.runtime"}}')" = distribution

      - name: Reuse only an identical existing backup-tool image
        id: existing-backup
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          reference="$BACKUP_TOOL_IMAGE:$IMAGE_TAG"
          set +e
          inspection="$(docker buildx imagetools inspect "$reference" 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if printf '%s' "$inspection" | grep -Eqi 'manifest unknown|name unknown|not found|404'; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf 'Unable to inspect %s:\n%s\n' "$reference" "$inspection" >&2
            exit "$status"
          fi
          docker pull "$reference"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_COMMIT"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "com.unstaticlabs.odoo.runtime"}}')" = backup
          digest_reference="$(docker image inspect "$reference" --format '{{index .RepoDigests 0}}')"
          digest="${digest_reference#*@}"
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Existing backup-tool image has no valid digest" >&2
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build and push backup tool once
        id: backup-build
        if: steps.existing-backup.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/backup.Dockerfile
          push: true
          tags: ${{ env.BACKUP_TOOL_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            USL_RELEASE_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backup-tool
          cache-to: type=gha,mode=max,scope=backup-tool

      - name: Resolve immutable backup-tool digest
        id: backup-release
        env:
          EXISTING_DIGEST: ${{ steps.existing-backup.outputs.digest }}
          BUILT_DIGEST: ${{ steps.backup-build.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Backup-tool build produced no valid sha256 digest" >&2
            exit 1
          fi
          echo "image=$BACKUP_TOOL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "digest_reference=$BACKUP_TOOL_IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Verify immutable backup-tool labels and runtime
        env:
          DIGEST_REFERENCE: ${{ steps.backup-release.outputs.digest_reference }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          docker pull "$DIGEST_REFERENCE"
          test "$(docker image inspect "$DIGEST_REFERENCE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_COMMIT"
          test "$(docker image inspect "$DIGEST_REFERENCE" --format '{{index .Config.Labels "com.unstaticlabs.odoo.runtime"}}')" = backup
          docker run --rm --entrypoint pg_dump "$DIGEST_REFERENCE" --version | grep -Eq ' 16([.]|$)'
          docker run --rm --entrypoint restic "$DIGEST_REFERENCE" version | grep -Eq '^restic 0[.]19[.]1'

      - name: Reuse only identical auxiliary images
        id: existing-aux
        env:
          RENDERER_COMMIT: ${{ steps.identity.outputs.renderer_commit }}
        run: |
          inspect_component() {
            key="$1"
            image="$2"
            tag="$3"
            revision="$4"
            source="$5"
            reference="$image:$tag"
            set +e
            inspection="$(docker buildx imagetools inspect "$reference" 2>&1)"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              if printf '%s' "$inspection" | grep -Eqi 'manifest unknown|name unknown|not found|404'; then
                echo "${key}_exists=false" >> "$GITHUB_OUTPUT"
                return
              fi
              printf 'Unable to inspect %s:\n%s\n' "$reference" "$inspection" >&2
              return "$status"
            fi
            docker pull "$reference"
            test "$(docker image inspect "$reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$revision"
            test "$(docker image inspect "$reference" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "$source"
            digest_reference="$(docker image inspect "$reference" --format '{{index .RepoDigests 0}}')"
            digest="${digest_reference#*@}"
            printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            echo "${key}_exists=true" >> "$GITHUB_OUTPUT"
            echo "${key}_digest=$digest" >> "$GITHUB_OUTPUT"
          }
          inspect_component paperless "$PAPERLESS_IMAGE" "$IMAGE_TAG" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY"
          inspect_component sign_dss "$SIGN_DSS_IMAGE" "$IMAGE_TAG" "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY"
          inspect_component renderer "$DOCUMENT_RENDERER_IMAGE" "sha-$RENDERER_COMMIT" "$RENDERER_COMMIT" "https://github.com/unstaticlabs/unstatic_latex_templates.git"

      - name: Build and push Paperless image once
        id: paperless-build
        if: steps.existing-aux.outputs.paperless_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/documents/paperless-ngx/Dockerfile
          push: true
          tags: ${{ env.PAPERLESS_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=paperless
          cache-to: type=gha,mode=max,scope=paperless

      - name: Build and push document renderer once
        id: renderer-build
        if: steps.existing-aux.outputs.renderer_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: services/usl-document-renderer
          push: true
          tags: ${{ env.DOCUMENT_RENDERER_IMAGE }}:sha-${{ steps.identity.outputs.renderer_commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/unstaticlabs/unstatic_latex_templates.git
            org.opencontainers.image.revision=${{ steps.identity.outputs.renderer_commit }}
          build-args: |
            USL_TEMPLATE_REVISION=${{ steps.identity.outputs.renderer_commit }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=document-renderer
          cache-to: type=gha,mode=max,scope=document-renderer

      - name: Build and push Sign DSS once
        id: sign-dss-build
        if: steps.existing-aux.outputs.sign_dss_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: services/usl-sign-dss/Dockerfile
          push: true
          tags: ${{ env.SIGN_DSS_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=sign-dss
          cache-to: type=gha,mode=max,scope=sign-dss

      - name: Resolve and verify auxiliary image digests
        id: aux-release
        env:
          EXISTING_PAPERLESS: ${{ steps.existing-aux.outputs.paperless_digest }}
          BUILT_PAPERLESS: ${{ steps.paperless-build.outputs.digest }}
          EXISTING_RENDERER: ${{ steps.existing-aux.outputs.renderer_digest }}
          BUILT_RENDERER: ${{ steps.renderer-build.outputs.digest }}
          EXISTING_SIGN_DSS: ${{ steps.existing-aux.outputs.sign_dss_digest }}
          BUILT_SIGN_DSS: ${{ steps.sign-dss-build.outputs.digest }}
          RENDERER_COMMIT: ${{ steps.identity.outputs.renderer_commit }}
        run: |
          paperless_digest="${EXISTING_PAPERLESS:-$BUILT_PAPERLESS}"
          renderer_digest="${EXISTING_RENDERER:-$BUILT_RENDERER}"
          sign_dss_digest="${EXISTING_SIGN_DSS:-$BUILT_SIGN_DSS}"
          for digest in "$paperless_digest" "$renderer_digest" "$sign_dss_digest"; do
            printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          done
          paperless_reference="$PAPERLESS_IMAGE@$paperless_digest"
          renderer_reference="$DOCUMENT_RENDERER_IMAGE@$renderer_digest"
          sign_dss_reference="$SIGN_DSS_IMAGE@$sign_dss_digest"
          docker pull "$paperless_reference"
          docker pull "$renderer_reference"
          docker pull "$sign_dss_reference"
          test "$(docker image inspect "$paperless_reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$renderer_reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$RENDERER_COMMIT"
          test "$(docker image inspect "$sign_dss_reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          echo "paperless_digest=$paperless_digest" >> "$GITHUB_OUTPUT"
          echo "paperless_digest_reference=$paperless_reference" >> "$GITHUB_OUTPUT"
          echo "renderer_digest=$renderer_digest" >> "$GITHUB_OUTPUT"
          echo "renderer_digest_reference=$renderer_reference" >> "$GITHUB_OUTPUT"
          echo "sign_dss_digest=$sign_dss_digest" >> "$GITHUB_OUTPUT"
          echo "sign_dss_digest_reference=$sign_dss_reference" >> "$GITHUB_OUTPUT"

      - name: Generate backup-tool build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.backup-release.outputs.image }}
          subject-digest: ${{ steps.backup-release.outputs.digest }}
          push-to-registry: true

      - name: Generate Paperless build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.PAPERLESS_IMAGE }}
          subject-digest: ${{ steps.aux-release.outputs.paperless_digest }}
          push-to-registry: true

      - name: Generate document-renderer build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.DOCUMENT_RENDERER_IMAGE }}
          subject-digest: ${{ steps.aux-release.outputs.renderer_digest }}
          push-to-registry: true

      - name: Generate Sign DSS build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.SIGN_DSS_IMAGE }}
          subject-digest: ${{ steps.aux-release.outputs.sign_dss_digest }}
          push-to-registry: true

      - name: Generate GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.release.outputs.digest }}
          push-to-registry: true

      - name: Write release metadata contract
        id: metadata
        env:
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
          BACKUP_TOOL_DIGEST: ${{ steps.backup-release.outputs.digest }}
          PAPERLESS_DIGEST: ${{ steps.aux-release.outputs.paperless_digest }}
          DOCUMENT_RENDERER_DIGEST: ${{ steps.aux-release.outputs.renderer_digest }}
          SIGN_DSS_DIGEST: ${{ steps.aux-release.outputs.sign_dss_digest }}
          DOCUMENT_RENDERER_COMMIT: ${{ steps.identity.outputs.renderer_commit }}
        run: |
          artifact_name="distribution-release-$GITHUB_SHA"
          python3 scripts/distribution_release.py create \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --image "$DISTRIBUTION_IMAGE" \
            --tag "$IMAGE_TAG" \
            --digest "$IMAGE_DIGEST" \
            --backup-tool-image "$BACKUP_TOOL_IMAGE" \
            --backup-tool-digest "$BACKUP_TOOL_DIGEST" \
            --paperless-image "$PAPERLESS_IMAGE" \
            --paperless-digest "$PAPERLESS_DIGEST" \
            --document-renderer-repository "https://github.com/unstaticlabs/unstatic_latex_templates.git" \
            --document-renderer-commit "$DOCUMENT_RENDERER_COMMIT" \
            --document-renderer-image "$DOCUMENT_RENDERER_IMAGE" \
            --document-renderer-digest "$DOCUMENT_RENDERER_DIGEST" \
            --sign-dss-image "$SIGN_DSS_IMAGE" \
            --sign-dss-digest "$SIGN_DSS_DIGEST" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output distribution-release.json
          python3 scripts/distribution_release.py validate \
            distribution-release.json \
            --commit "$GITHUB_SHA" \
            --image "$DISTRIBUTION_IMAGE" \
            --backup-tool-image "$BACKUP_TOOL_IMAGE" \
            --paperless-image "$PAPERLESS_IMAGE" \
            --document-renderer-image "$DOCUMENT_RENDERER_IMAGE" \
            --sign-dss-image "$SIGN_DSS_IMAGE"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: distribution-release.json
          if-no-files-found: error
          retention-days: 90

      - name: Expose immutable release identity
        env:
          DIGEST_REFERENCE: ${{ steps.release.outputs.digest_reference }}
          BACKUP_TOOL_DIGEST_REFERENCE: ${{ steps.backup-release.outputs.digest_reference }}
          PAPERLESS_DIGEST_REFERENCE: ${{ steps.aux-release.outputs.paperless_digest_reference }}
          DOCUMENT_RENDERER_DIGEST_REFERENCE: ${{ steps.aux-release.outputs.renderer_digest_reference }}
          SIGN_DSS_DIGEST_REFERENCE: ${{ steps.aux-release.outputs.sign_dss_digest_reference }}
          METADATA_ARTIFACT: ${{ steps.metadata.outputs.artifact_name }}
        run: |
          {
            printf '## Distribution release\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Commit tag: `%s:%s`\n' "$DISTRIBUTION_IMAGE" "$IMAGE_TAG"
            printf -- '- Production identity: `%s`\n' "$DIGEST_REFERENCE"
            printf -- '- Backup-tool identity: `%s`\n' "$BACKUP_TOOL_DIGEST_REFERENCE"
            printf -- '- Paperless identity: `%s`\n' "$PAPERLESS_DIGEST_REFERENCE"
            printf -- '- Document-renderer identity: `%s`\n' "$DOCUMENT_RENDERER_DIGEST_REFERENCE"
            printf -- '- Sign DSS identity: `%s`\n' "$SIGN_DSS_DIGEST_REFERENCE"
            printf -- '- Metadata artifact: `%s`\n' "$METADATA_ARTIFACT"
            printf -- '- OCI SBOM: attached by BuildKit\n'
            printf -- '- Build provenance: BuildKit plus GitHub artifact attestation\n'
          } >> "$GITHUB_STEP_SUMMARY"
