# Build only changed release components. Production deployment consumes the
# resulting immutable release manifest; this workflow never changes a runtime.
name: Distribution release

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      qualification_evidence_sha256:
        required: true
        type: string
      qualification_run_id:
        required: true
        type: number
  workflow_dispatch:
    inputs:
      recovery_ref:
        description: Recovery release reference (must start with recovery-)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: distribution-release-${{ github.ref }}
  cancel-in-progress: false

env:
  OLLAMA_IMAGE: ollama/ollama@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
  OLLAMA_MODEL: bge-m3:latest
  OLLAMA_MANIFEST_SHA256: 7907646426070047a77226ac3e684fbbe8410524f7b4a74d02837e43f2146bab
  OLLAMA_DIMENSION: "1024"

jobs:
  resolve:
    name: Resolve component inputs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
      mcp_commit: ${{ steps.inputs.outputs.mcp_commit }}
      evidence_sha256: ${{ steps.admit.outputs.evidence_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Validate caller or explicit recovery source
        id: admit
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          QUALIFICATION_EVIDENCE_SHA256: ${{ inputs.qualification_evidence_sha256 }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          RECOVERY_REF: ${{ inputs.recovery_ref }}
        run: |
          if [ -n "$SOURCE_REF" ]; then
            case "$GITHUB_REF" in refs/heads/19-usl|refs/heads/19-usl-staging) ;; *) exit 2 ;; esac
              test "$SOURCE_REF" = "$GITHUB_REF"
              test "$SOURCE_COMMIT" = "$GITHUB_SHA"
              printf '%s\n' "$QUALIFICATION_EVIDENCE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
              printf '%s\n' "$QUALIFICATION_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
              evidence_sha256="$QUALIFICATION_EVIDENCE_SHA256"
          else
            case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
              workflow_dispatch:refs/tags/recovery-*) ;;
              *) printf 'Release source is not authorized: %s %s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" >&2; exit 2 ;;
            esac
              test "$RECOVERY_REF" = "${GITHUB_REF#refs/tags/}"
              jq -n --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" \
                '{event: "workflow_dispatch", ref: $ref, commit: $sha, explicitly_dispatched: true}' \
                > recovery-evidence.json
              evidence_sha256="$(sha256sum recovery-evidence.json | cut -d' ' -f1)"
          fi
          echo "evidence_sha256=$evidence_sha256" >> "$GITHUB_OUTPUT"
      - name: Resolve deterministic component identities
        id: inputs
        run: |
          scripts/component-build --json > component-inputs.json
          jq -c '{include: [.components | to_entries[] | .value + {name: .key}]}' \
            component-inputs.json | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"
          echo "mcp_commit=$(jq -r .commit deploy/odoo-mcp/release.json)" >> "$GITHUB_OUTPUT"
          cat component-inputs.json

  external:
    name: Verify MCP and renderer
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Distribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Checkout pinned Odoo MCP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: unstaticlabs/odoo-mcp
          ref: ${{ needs.resolve.outputs.mcp_commit }}
          path: .release/odoo-mcp
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify external contracts and private package access
        run: |
          scripts/odoo-mcp verify --repository "$GITHUB_WORKSPACE/.release/odoo-mcp"
          mcp_image="$(jq -r .image_digest deploy/odoo-mcp/release.json)"
          renderer_image="$(jq -r .image_digest deploy/document-renderer/release.json)"
          docker pull "$mcp_image"
          docker pull "$renderer_image"
          scripts/odoo-mcp verify-image --repository "$GITHUB_WORKSPACE/.release/odoo-mcp"
          test "$(docker image inspect "$renderer_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            "$(jq -r .commit deploy/document-renderer/release.json)"

  component:
    name: ${{ matrix.name }} image
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Resolve OCA inputs only for Odoo
        if: matrix.name == 'distribution'
        run: scripts/sync-oca-addons
      - name: Resolve Odoo policy identities
        id: policy
        if: matrix.name == 'distribution'
        run: |
          echo "oca=$(PYTHONPATH=. python3 -c 'from operations.release_identity import oca_bundle_sha256; print(oca_bundle_sha256())')" >> "$GITHUB_OUTPUT"
          echo "action_risk=$(PYTHONPATH=. python3 -c 'from operations.release_identity import action_risk_policy_sha256; print(action_risk_policy_sha256())')" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check immutable content image
        id: existing
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
        run: |
          started="$(date +%s)"
          reference="$IMAGE:$TAG"
          set +e
          inspection="$(docker buildx imagetools inspect "$reference" 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$inspection" | grep -Eqi 'manifest unknown|name unknown|not found|404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf 'Cannot inspect %s:\n%s\n' "$reference" "$inspection" >&2
            exit "$status"
          fi
          echo "started=$started" >> "$GITHUB_OUTPUT"
      - name: Build and publish missing content image
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ matrix.image }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            com.unstaticlabs.component.name=${{ matrix.name }}
            com.unstaticlabs.component.input-sha256=${{ matrix.input_sha256 }}
          build-args: |
            USL_COMPONENT_INPUT_SHA256=${{ matrix.input_sha256 }}
            USL_OCA_BUNDLE_SHA256=${{ steps.policy.outputs.oca }}
            USL_ACTION_RISK_POLICY_SHA256=${{ steps.policy.outputs.action_risk }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=registry,ref=${{ matrix.image }}:buildcache
            type=gha,scope=${{ matrix.name }}
          cache-to: type=registry,ref=${{ matrix.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
      - name: Resolve immutable component digest
        id: release
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          REUSED: ${{ steps.existing.outputs.exists }}
          STARTED: ${{ steps.existing.outputs.started }}
          COMPONENT_NAME: ${{ matrix.name }}
          INPUT_SHA256: ${{ matrix.input_sha256 }}
        run: |
          digest="$BUILT_DIGEST"
          if [ -z "$digest" ]; then
            digest="sha256:$(docker buildx imagetools inspect --raw "$IMAGE:$TAG" | sha256sum | cut -d' ' -f1)"
          fi
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          elapsed="$(( $(date +%s) - STARTED ))"
          result=built
          [ "$REUSED" = true ] && result=reused
          {
            printf '### %s\n\n' "$COMPONENT_NAME"
            # shellcheck disable=SC2016
            printf -- '- Result: `%s`\n' "$result"
            # shellcheck disable=SC2016
            printf -- '- Inputs: `%s`\n' "$INPUT_SHA256"
            # shellcheck disable=SC2016
            printf -- '- Image: `%s@%s`\n' "$IMAGE" "$digest"
            # shellcheck disable=SC2016
            printf -- '- Job time: `%ss`\n' "$elapsed"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Qualify isolated receipt component
        if: matrix.name == 'receipt-fetcher' || matrix.name == 'receipt-egress'
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
          COMPONENT: ${{ matrix.name }}
        run: |
          docker pull "$IMAGE:$TAG"
          if [ "$COMPONENT" = receipt-egress ]; then
            docker run --rm "$IMAGE:$TAG" --version
            exit 0
          fi
          docker run --rm \
            --entrypoint python \
            --volume "$GITHUB_WORKSPACE/services/usl-receipt-fetcher/test_app.py:/app/test_app.py:ro" \
            "$IMAGE:$TAG" -m unittest -v /app/test_app.py
          docker run --rm \
            --read-only \
            --cap-drop ALL \
            --cap-add SYS_CHROOT \
            --security-opt no-new-privileges:true \
            --security-opt "seccomp=$GITHUB_WORKSPACE/services/usl-receipt-fetcher/seccomp_profile.json" \
            --pids-limit 256 \
            --memory 768m \
            --shm-size 256m \
            --tmpfs /tmp/receipt-fetcher:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
            --entrypoint python \
            "$IMAGE:$TAG" -c \
            'import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(chromium_sandbox=True)
                  page = await browser.new_page()
                  await page.set_content("""<title>sandbox-ready</title>
                      <button id="download">Download PDF</button>
                      <script>
                        document.querySelector("#download").onclick = () => {
                          const a = document.createElement("a");
                          a.href = "data:application/pdf,%25PDF-1.4%20fixture";
                          a.download = "receipt.pdf";
                          a.click();
                        };
                      </script>""")
                  assert await page.title() == "sandbox-ready"
                  async with page.expect_download() as pending:
                      await page.locator("#download").click()
                  download = await pending.value
                  assert download.suggested_filename == "receipt.pdf"
                  await browser.close()
          asyncio.run(main())'
      - name: Attest component image
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.release.outputs.digest }}
          push-to-registry: true

  release:
    name: Assemble coordinated release
    needs: [resolve, external, component]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve verified renderer identity
        id: renderer
        run: |
          reference="$(jq -r .image_digest deploy/document-renderer/release.json)"
          case "$reference" in
            ghcr.io/unstaticlabs/usl-document-renderer@sha256:*) ;;
            *) printf 'Renderer image is not the governed GHCR package: %s\n' "$reference" >&2; exit 1 ;;
          esac
          subject_name="${reference%@*}"
          subject_digest="${reference#*@}"
          printf '%s\n' "$subject_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$subject_name@$subject_digest" = "$reference"
          echo "subject_name=$subject_name" >> "$GITHUB_OUTPUT"
          echo "subject_digest=$subject_digest" >> "$GITHUB_OUTPUT"
      - name: Attest verified renderer as distribution integrator
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.renderer.outputs.subject_name }}
          subject-digest: ${{ steps.renderer.outputs.subject_digest }}
          create-storage-record: true
      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      - name: Create release manifest from published components
        run: |
          scripts/component-build --json > component-inputs.json
          odoo_core_commit="$(git log -1 --format=%H -- odoo addons setup setup.py MANIFEST.in)"
          odoo_core_sha="$(PYTHONPATH=. python3 -c 'from operations.release_identity import odoo_core_sha256; print(odoo_core_sha256())')"
          scripts/sync-oca-addons
          oca_sha="$(PYTHONPATH=. python3 -c 'from operations.release_identity import oca_bundle_sha256; print(oca_bundle_sha256())')"
          constraints_sha="$(sha256sum docker/constraints.txt requirements.txt | sha256sum | cut -d' ' -f1)"
          policy_sha="$(PYTHONPATH=. python3 -c 'from operations.release_identity import action_risk_policy_sha256; print(action_risk_policy_sha256())')"
          contract_evidence="$(git ls-files operations scripts/tests .github/workflows | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          arguments=()
          while IFS=$'\t' read -r name inputs image tag; do
            digest="sha256:$(docker buildx imagetools inspect --raw "$image:$tag" | sha256sum | cut -d' ' -f1)"
            arguments+=(--component "$name,$inputs,$image,$tag,$digest")
          done < <(jq -r '.components | to_entries[] | [.key,.value.input_sha256,.value.image,.value.tag] | @tsv' component-inputs.json)
          scripts/release-manifest create \
            --repository "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" \
            --commit "$GITHUB_SHA" \
            "${arguments[@]}" \
            --renderer-release deploy/document-renderer/release.json \
            --release-notes operations/release-notes.json \
            --odoo-series 19.3 \
            --odoo-core-commit "$odoo_core_commit" \
            --odoo-core-sha256 "$odoo_core_sha" \
            --oca-sha256 "$oca_sha" \
            --python-constraints-sha256 "$constraints_sha" \
            --security-policy-sha256 "$policy_sha" \
            --ollama-model "$OLLAMA_MODEL" \
            --ollama-manifest "$OLLAMA_MANIFEST_SHA256" \
            --ollama-dimension "$OLLAMA_DIMENSION" \
            --evidence "usl-qualification=${{ needs.resolve.outputs.evidence_sha256 }}" \
            --evidence "release-contract=$contract_evidence" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output usl-release.json
          scripts/release-manifest validate usl-release.json --commit "$GITHUB_SHA"
      - name: Publish coordinated release as immutable OCI artifact
        id: release_oci
        run: |
          reference="ghcr.io/unstaticlabs/usl-odoo-release:sha-$GITHUB_SHA"
          oras push --artifact-type application/vnd.usl.odoo.release.v3+json \
            "$reference" usl-release.json:application/json
          digest="$(oras resolve "$reference")"
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=ghcr.io/unstaticlabs/usl-odoo-release@$digest" >> "$GITHUB_OUTPUT"
      - name: Attest coordinated release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/unstaticlabs/usl-odoo-release
          subject-digest: ${{ steps.release_oci.outputs.digest }}
          push-to-registry: true
      - name: Retain human-readable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usl-release-${{ github.sha }}
          path: usl-release.json
          if-no-files-found: error
          retention-days: 90
      - name: Trigger protected GitOps ingestion
        if: vars.USL_RELEASE_AUTOMATION_ENABLED == 'true'
        env:
          GITOPS_PIPELINE_TRIGGER_URL: ${{ secrets.GITOPS_PIPELINE_TRIGGER_URL }}
          GITOPS_PIPELINE_TRIGGER_TOKEN: ${{ secrets.GITOPS_PIPELINE_TRIGGER_TOKEN }}
          RELEASE_MANIFEST_DIGEST: ${{ steps.release_oci.outputs.reference }}
        run: |
          test -n "$GITOPS_PIPELINE_TRIGGER_URL"
          test -n "$GITOPS_PIPELINE_TRIGGER_TOKEN"
          curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST "$GITOPS_PIPELINE_TRIGGER_URL" \
            --form "token=$GITOPS_PIPELINE_TRIGGER_TOKEN" \
            --form "ref=main" \
            --form "variables[USL_RELEASE_MANIFEST]=$RELEASE_MANIFEST_DIGEST" \
            --form "variables[USL_SOURCE_REPOSITORY]=$GITHUB_REPOSITORY" \
            --form "variables[USL_SOURCE_REF]=$GITHUB_REF" \
            --form "variables[USL_SOURCE_COMMIT]=$GITHUB_SHA" \
            --form "variables[USL_GITHUB_RUN_ID]=$GITHUB_RUN_ID"
      - name: Summarize release
        run: |
          # shellcheck disable=SC2016
          {
            printf '## Coordinated release\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            jq -r '.components | to_entries[] | "- \(.key): `\(.value.digest_reference)`"' usl-release.json
            printf -- '- MCP: `%s`\n' "$(jq -r .mcp.image usl-release.json)"
            printf -- '- Renderer: `%s`\n' "$(jq -r .renderer.image usl-release.json)"
          } >> "$GITHUB_STEP_SUMMARY"
