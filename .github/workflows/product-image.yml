# Publish repository-owned production runtime artifacts only after a merge has
# reached 19-usl. Candidate and merge-group compute intentionally remains local.
name: Distribution release

on:
  push:
    branches:
      - 19-usl

permissions:
  contents: read

concurrency:
  group: distribution-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate deployed release and plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      USL_DEPLOYED_RELEASE_RUN_ID: ${{ vars.USL_DEPLOYED_RELEASE_RUN_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout immutable source and full release ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve only the explicitly selected deployed release
        run: |
          mkdir -p planning
          run_id="${USL_DEPLOYED_RELEASE_RUN_ID:-}"
          if [ -n "$run_id" ]; then
            if printf '%s\n' "$run_id" | grep -Eq '^[1-9][0-9]*$' && \
              python3 scripts/prior_release_input.py \
                --repository "$GITHUB_REPOSITORY" \
                --run-id "$run_id" \
                --to-commit "$GITHUB_SHA" \
                --output planning/prior-release.json; then
              echo "Validated deployed release input from Actions run $run_id"
            else
              rm -f planning/prior-release.json
              echo "::warning::Configured deployed release is unavailable or invalid; building all artifacts and planning a full upgrade"
            fi
          else
            echo "::notice::No deployed release input is configured; building all artifacts and planning a full upgrade"
          fi

      - name: Derive artifact and Odoo upgrade plans
        run: |
          from_args=()
          if [ -f planning/prior-release.json ]; then
            from_sha="$(python3 -c 'import json; print(json.load(open("planning/prior-release.json"))["source"]["commit_sha"])')"
            from_args=(--from-commit "$from_sha")
          fi
          python3 scripts/artifact_build_plan.py \
            "${from_args[@]}" \
            --to-commit "$GITHUB_SHA" \
            --output planning/artifact-build-plan.json
          python3 scripts/upgrade_plan.py \
            "${from_args[@]}" \
            --to-commit "$GITHUB_SHA" \
            --output planning/upgrade-plan.json

      - name: Upload immutable planning inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-planning-${{ github.sha }}
          path: planning
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ matrix.role }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: odoo_distribution
            image: ghcr.io/unstaticlabs/usl-odoo
            context: .
            file: Dockerfile
            target: distribution
            runtime: distribution
          - role: operations_tool
            image: ghcr.io/unstaticlabs/usl-odoo-operations
            context: .
            file: docker/operations.Dockerfile
            target: runtime
            runtime: continuous-operations
          - role: paperless_overlay
            image: ghcr.io/unstaticlabs/usl-paperless-ngx
            context: .
            file: deploy/documents/paperless-ngx/Dockerfile
            target: ""
            runtime: paperless-overlay
          - role: document_renderer
            image: ghcr.io/unstaticlabs/usl-document-renderer
            context: services/usl-document-renderer
            file: Dockerfile
            target: ""
            runtime: document-renderer
          - role: native_sign_dss
            image: ghcr.io/unstaticlabs/usl-sign-dss
            context: .
            file: services/usl-sign-dss/Dockerfile
            target: ""
            runtime: native-sign-dss
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout immutable source and renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Download validated planning inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          name: release-planning-${{ github.sha }}
          path: planning

      - name: Resolve role decision without registry inference
        id: role
        env:
          ROLE: ${{ matrix.role }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path("planning/artifact-build-plan.json").read_text())
          role = os.environ["ROLE"]
          build = role in plan["build_roles"]
          if not build:
              prior = json.loads(Path("planning/prior-release.json").read_text())
              digest = prior["artifacts"][role]["digest"]
          else:
              digest = ""
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
              stream.write(f"build={'true' if build else 'false'}\n")
              stream.write(f"prior_digest={digest}\n")
          PY

      - name: Sync pinned OCA add-ons
        if: steps.role.outputs.build == 'true' && matrix.role == 'odoo_distribution'
        run: scripts/sync-oca-addons

      - name: Resolve Distribution identity inputs
        id: identity
        if: steps.role.outputs.build == 'true'
        run: |
          if [ "${{ matrix.role }}" = odoo_distribution ]; then
            oca_digest="$(PYTHONPATH=. python3 -c 'from scripts.release_identity import oca_bundle_sha256; print(oca_bundle_sha256())')"
            action_risk_digest="$(PYTHONPATH=. python3 -c 'from scripts.release_identity import action_risk_policy_sha256; print(action_risk_policy_sha256())')"
          else
            oca_digest=not-applicable
            action_risk_digest=not-applicable
          fi
          echo "oca_digest=$oca_digest" >> "$GITHUB_OUTPUT"
          echo "action_risk_digest=$action_risk_digest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.role.outputs.build == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR with the workflow token
        if: steps.role.outputs.build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push changed immutable artifact
        id: build
        if: steps.role.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ matrix.image }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.unstaticlabs.odoo.runtime=${{ matrix.runtime }}
          build-args: |
            USL_RELEASE_COMMIT=${{ github.sha }}
            USL_OCA_BUNDLE_SHA256=${{ steps.identity.outputs.oca_digest }}
            USL_ACTION_RISK_POLICY_SHA256=${{ steps.identity.outputs.action_risk_digest }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=${{ matrix.role }}

      - name: Verify newly built immutable digest
        if: steps.role.outputs.build == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          RUNTIME: ${{ matrix.runtime }}
          EXPECTED_OCA: ${{ steps.identity.outputs.oca_digest }}
          EXPECTED_ACTION_RISK: ${{ steps.identity.outputs.action_risk_digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          reference="$IMAGE@$DIGEST"
          docker pull "$reference"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "com.unstaticlabs.odoo.runtime"}}')" = "$RUNTIME"
          if [ "${{ matrix.role }}" = odoo_distribution ]; then
            test "$(docker image inspect "$reference" --format '{{index .Config.Labels "com.unstaticlabs.odoo.oca-bundle-sha256"}}')" = "$EXPECTED_OCA"
            test "$(docker image inspect "$reference" --format '{{index .Config.Labels "com.unstaticlabs.odoo.action-risk-policy-sha256"}}')" = "$EXPECTED_ACTION_RISK"
          fi

      - name: Generate GitHub build provenance
        if: steps.role.outputs.build == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record exact artifact digest
        env:
          ROLE: ${{ matrix.role }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          PRIOR_DIGEST: ${{ steps.role.outputs.prior_digest }}
        run: |
          mkdir -p digests
          digest="${BUILT_DIGEST:-$PRIOR_DIGEST}"
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '{"role":"%s","digest":"%s"}\n' "$ROLE" "$digest" > "digests/$ROLE.json"

      - name: Upload artifact digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digest-${{ matrix.role }}
          path: digests/${{ matrix.role }}.json
          if-no-files-found: error
          retention-days: 7

  metadata:
    name: Publish release v3 metadata
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout immutable source and renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Sync pinned OCA add-ons
        run: scripts/sync-oca-addons

      - name: Download validated planning inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          name: release-planning-${{ github.sha }}
          path: planning

      - name: Download exact artifact digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          pattern: release-digest-*
          path: digests
          merge-multiple: true

      - name: Write and validate release contract
        id: metadata
        run: |
          digest() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["digest"])' "digests/$1.json"; }
          prior_args=()
          if [ -f planning/prior-release.json ]; then
            prior_args=(--prior-release planning/prior-release.json)
          fi
          oca_digest="$(PYTHONPATH=. python3 -c 'from scripts.release_identity import oca_bundle_sha256; print(oca_bundle_sha256())')"
          action_risk_digest="$(PYTHONPATH=. python3 -c 'from scripts.release_identity import action_risk_policy_sha256; print(action_risk_policy_sha256())')"
          renderer_commit="$(git rev-parse HEAD:services/usl-document-renderer)"
          mkdir -p release-metadata
          python3 scripts/distribution_release.py create \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --odoo-distribution-digest "$(digest odoo_distribution)" \
            --operations-tool-digest "$(digest operations_tool)" \
            --paperless-overlay-digest "$(digest paperless_overlay)" \
            --document-renderer-digest "$(digest document_renderer)" \
            --native-sign-dss-digest "$(digest native_sign_dss)" \
            --oca-bundle-sha256 "$oca_digest" \
            --action-risk-policy-sha256 "$action_risk_digest" \
            --renderer-repository unstaticlabs/usl-document-renderer \
            --renderer-commit "$renderer_commit" \
            --artifact-plan planning/artifact-build-plan.json \
            --upgrade-plan planning/upgrade-plan.json \
            "${prior_args[@]}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output release-metadata/distribution-release.json
          python3 scripts/distribution_release.py validate \
            release-metadata/distribution-release.json \
            --commit "$GITHUB_SHA" \
            "${prior_args[@]}"
          if [ -f planning/prior-release.json ]; then
            cp planning/prior-release.json release-metadata/candidate-prior-release.json
          fi
          echo "artifact_name=distribution-release-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload lightweight release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: release-metadata
          if-no-files-found: error
          retention-days: 90
