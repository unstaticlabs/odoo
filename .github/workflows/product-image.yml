# Qualify pull requests and publish the production Distribution image exactly
# once per 19-usl commit. Deployment systems consume the digest artifact; they
# never rebuild the image or treat a mutable tag as release identity.
name: Distribution image

on:
  # Run on stacked pull requests too; publish remains restricted to 19-usl.
  pull_request:
  push:
    branches:
      - 19-usl
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-image-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DISTRIBUTION_IMAGE: ghcr.io/unstaticlabs/usl-odoo
  BACKUP_TOOL_IMAGE: ghcr.io/unstaticlabs/usl-odoo-backup

jobs:
  qualify:
    name: Qualify repository and image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      USL_EINVOICE_LIVE_ENABLED: "0"
      USL_EREPORTING_LIVE_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Sync pinned OCA add-ons
        run: scripts/sync-oca-addons

      - name: Select qualified Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run release pipeline unit checks
        run: python3 -m unittest scripts.tests.test_distribution_release scripts.tests.test_odoo_backup

      - name: Check reviewed source action inventory
        run: make action-risk-inventory

      - name: Run access-control suite on the delivered product registry
        env:
          COMPOSE_PROJECT_NAME: usl-odoo-action-risk-${{ github.run_id }}-${{ github.run_attempt }}
          TEST_DATABASE: odoo_action_risk_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          product_modules='rebuild_account_migration,usl_access_control,usl_accounting,usl_b2c,usl_documents,usl_documents_accounting,usl_documents_b2c,usl_expense_batch,usl_locale,usl_platform_billing,usl_platform_billing_pocketid,usl_pocketid,usl_project,usl_tese_accounting,usl_tese_payroll'
          docker compose --profile test run --rm \
            -e ODOO_INIT_DB="$TEST_DATABASE" \
            test odoo --config=/etc/odoo/odoo.conf \
            --database="$TEST_DATABASE" \
            --init="$product_modules" \
            --without-demo=true \
            --stop-after-init \
            --log-level=warn
          docker compose --profile test run --rm -T \
            -e ODOO_INIT_DB="$TEST_DATABASE" \
            test odoo shell --config=/etc/odoo/odoo.conf \
            --database="$TEST_DATABASE" \
            --shell-interface=python \
            < scripts/odoo/enforce_product_module_scope.py
          docker compose --profile test run --rm \
            -e ODOO_INIT_DB="$TEST_DATABASE" \
            test odoo --config=/etc/odoo/odoo.conf \
            --database="$TEST_DATABASE" \
            --update="$product_modules" \
            --without-demo=true \
            --test-enable \
            --test-tags=/usl_access_control \
            --stop-after-init \
            --log-level=warn
          docker compose --profile test run --rm -T \
            -e ODOO_INIT_DB="$TEST_DATABASE" \
            -e ACTION_RISK_MODE=check \
            test odoo shell --config=/etc/odoo/odoo.conf \
            --database="$TEST_DATABASE" \
            --shell-interface=python \
            < scripts/odoo/action_risk_inventory.py
          docker compose --profile test run --rm -T \
            -e ODOO_INIT_DB="$TEST_DATABASE" \
            test odoo shell --config=/etc/odoo/odoo.conf \
            --database="$TEST_DATABASE" \
            --shell-interface=python \
            < scripts/odoo/compile_product_assets.py

      - name: Remove qualification services and volumes
        if: always()
        env:
          COMPOSE_PROJECT_NAME: usl-odoo-action-risk-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose --profile test down --volumes --remove-orphans

      - name: Resolve image labels
        if: github.event_name != 'push'
        id: release
        run: |
          oca_digest="$(PYTHONPATH=. python3 -c 'from scripts.release_identity import oca_bundle_sha256; print(oca_bundle_sha256())')"
          action_risk_digest="$(PYTHONPATH=. python3 -c 'from scripts.release_identity import action_risk_policy_sha256; print(action_risk_policy_sha256())')"
          echo "oca_digest=$oca_digest" >> "$GITHUB_OUTPUT"
          echo "action_risk_digest=$action_risk_digest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx for build validation
        if: github.event_name != 'push'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Distribution image without publishing
        if: github.event_name != 'push'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: distribution
          push: false
          load: true
          tags: usl-odoo-ci:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            USL_RELEASE_COMMIT=${{ github.sha }}
            USL_OCA_BUNDLE_SHA256=${{ steps.release.outputs.oca_digest }}
            USL_ACTION_RISK_POLICY_SHA256=${{ steps.release.outputs.action_risk_digest }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=distribution

      - name: Verify locally built Distribution image
        if: github.event_name != 'push'
        env:
          IMAGE: usl-odoo-ci:sha-${{ github.sha }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_OCA: ${{ steps.release.outputs.oca_digest }}
          EXPECTED_ACTION_RISK: ${{ steps.release.outputs.action_risk_digest }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_COMMIT"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "com.unstaticlabs.odoo.oca-bundle-sha256"}}')" = "$EXPECTED_OCA"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "com.unstaticlabs.odoo.action-risk-policy-sha256"}}')" = "$EXPECTED_ACTION_RISK"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "com.unstaticlabs.odoo.runtime"}}')" = distribution

      - name: Build backup tool without publishing
        if: github.event_name != 'push'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/backup.Dockerfile
          push: false
          load: true
          tags: usl-odoo-backup-ci:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            USL_RELEASE_COMMIT=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backup-tool

      - name: Verify locally built backup tool
        if: github.event_name != 'push'
        env:
          IMAGE: usl-odoo-backup-ci:sha-${{ github.sha }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_COMMIT"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "com.unstaticlabs.odoo.runtime"}}')" = backup
          docker run --rm --entrypoint pg_dump "$IMAGE" --version | grep -Eq ' 16([.]|$)'
          docker run --rm --entrypoint restic "$IMAGE" version | grep -Eq '^restic 0[.]19[.]1'
          docker run --rm "$IMAGE" --help >/dev/null

  publish:
    name: Publish immutable Distribution image
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/19-usl'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.release.outputs.image }}
      tag: ${{ steps.release.outputs.tag }}
      digest: ${{ steps.release.outputs.digest }}
      digest_reference: ${{ steps.release.outputs.digest_reference }}
      metadata_artifact: ${{ steps.metadata.outputs.artifact_name }}
      backup_tool_image: ${{ steps.backup-release.outputs.image }}
      backup_tool_tag: ${{ steps.backup-release.outputs.tag }}
      backup_tool_digest: ${{ steps.backup-release.outputs.digest }}
      backup_tool_digest_reference: ${{ steps.backup-release.outputs.digest_reference }}
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Sync pinned OCA add-ons
        run: scripts/sync-oca-addons

      - name: Resolve release build identity
        id: identity
        run: |
          oca_digest="$(PYTHONPATH=. python3 -c 'from scripts.release_identity import oca_bundle_sha256; print(oca_bundle_sha256())')"
          action_risk_digest="$(PYTHONPATH=. python3 -c 'from scripts.release_identity import action_risk_policy_sha256; print(action_risk_policy_sha256())')"
          echo "oca_digest=$oca_digest" >> "$GITHUB_OUTPUT"
          echo "action_risk_digest=$action_risk_digest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse only an identical existing commit image
        id: existing
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_OCA: ${{ steps.identity.outputs.oca_digest }}
          EXPECTED_ACTION_RISK: ${{ steps.identity.outputs.action_risk_digest }}
        run: |
          reference="$DISTRIBUTION_IMAGE:$IMAGE_TAG"
          set +e
          inspection="$(docker buildx imagetools inspect "$reference" 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if printf '%s' "$inspection" | grep -Eqi 'manifest unknown|name unknown|not found|404'; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf 'Unable to inspect %s:\n%s\n' "$reference" "$inspection" >&2
            exit "$status"
          fi
          docker pull "$reference"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_COMMIT"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "com.unstaticlabs.odoo.oca-bundle-sha256"}}')" = "$EXPECTED_OCA"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "com.unstaticlabs.odoo.action-risk-policy-sha256"}}')" = "$EXPECTED_ACTION_RISK"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "com.unstaticlabs.odoo.runtime"}}')" = distribution
          digest_reference="$(docker image inspect "$reference" --format '{{index .RepoDigests 0}}')"
          digest="${digest_reference#*@}"
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Existing image has no valid digest" >&2
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build and push Distribution image once
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: distribution
          push: true
          tags: ${{ env.DISTRIBUTION_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            USL_RELEASE_COMMIT=${{ github.sha }}
            USL_OCA_BUNDLE_SHA256=${{ steps.identity.outputs.oca_digest }}
            USL_ACTION_RISK_POLICY_SHA256=${{ steps.identity.outputs.action_risk_digest }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=distribution
          cache-to: type=gha,mode=max,scope=distribution

      - name: Resolve immutable image digest
        id: release
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Build produced no valid sha256 digest" >&2
            exit 1
          fi
          echo "image=$DISTRIBUTION_IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "digest_reference=$DISTRIBUTION_IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Verify immutable Distribution labels and digest
        env:
          DIGEST_REFERENCE: ${{ steps.release.outputs.digest_reference }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_OCA: ${{ steps.identity.outputs.oca_digest }}
          EXPECTED_ACTION_RISK: ${{ steps.identity.outputs.action_risk_digest }}
        run: |
          docker pull "$DIGEST_REFERENCE"
          test "$(docker image inspect "$DIGEST_REFERENCE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_COMMIT"
          test "$(docker image inspect "$DIGEST_REFERENCE" --format '{{index .Config.Labels "com.unstaticlabs.odoo.oca-bundle-sha256"}}')" = "$EXPECTED_OCA"
          test "$(docker image inspect "$DIGEST_REFERENCE" --format '{{index .Config.Labels "com.unstaticlabs.odoo.action-risk-policy-sha256"}}')" = "$EXPECTED_ACTION_RISK"
          test "$(docker image inspect "$DIGEST_REFERENCE" --format '{{index .Config.Labels "com.unstaticlabs.odoo.runtime"}}')" = distribution

      - name: Reuse only an identical existing backup-tool image
        id: existing-backup
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          reference="$BACKUP_TOOL_IMAGE:$IMAGE_TAG"
          set +e
          inspection="$(docker buildx imagetools inspect "$reference" 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if printf '%s' "$inspection" | grep -Eqi 'manifest unknown|name unknown|not found|404'; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf 'Unable to inspect %s:\n%s\n' "$reference" "$inspection" >&2
            exit "$status"
          fi
          docker pull "$reference"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_COMMIT"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "com.unstaticlabs.odoo.runtime"}}')" = backup
          digest_reference="$(docker image inspect "$reference" --format '{{index .RepoDigests 0}}')"
          digest="${digest_reference#*@}"
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Existing backup-tool image has no valid digest" >&2
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build and push backup tool once
        id: backup-build
        if: steps.existing-backup.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/backup.Dockerfile
          push: true
          tags: ${{ env.BACKUP_TOOL_IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            USL_RELEASE_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backup-tool
          cache-to: type=gha,mode=max,scope=backup-tool

      - name: Resolve immutable backup-tool digest
        id: backup-release
        env:
          EXISTING_DIGEST: ${{ steps.existing-backup.outputs.digest }}
          BUILT_DIGEST: ${{ steps.backup-build.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Backup-tool build produced no valid sha256 digest" >&2
            exit 1
          fi
          echo "image=$BACKUP_TOOL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "digest_reference=$BACKUP_TOOL_IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Verify immutable backup-tool labels and runtime
        env:
          DIGEST_REFERENCE: ${{ steps.backup-release.outputs.digest_reference }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          docker pull "$DIGEST_REFERENCE"
          test "$(docker image inspect "$DIGEST_REFERENCE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_COMMIT"
          test "$(docker image inspect "$DIGEST_REFERENCE" --format '{{index .Config.Labels "com.unstaticlabs.odoo.runtime"}}')" = backup
          docker run --rm --entrypoint pg_dump "$DIGEST_REFERENCE" --version | grep -Eq ' 16([.]|$)'
          docker run --rm --entrypoint restic "$DIGEST_REFERENCE" version | grep -Eq '^restic 0[.]19[.]1'

      - name: Generate backup-tool build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.backup-release.outputs.image }}
          subject-digest: ${{ steps.backup-release.outputs.digest }}
          push-to-registry: true

      - name: Generate GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.release.outputs.digest }}
          push-to-registry: true

      - name: Write release metadata contract
        id: metadata
        env:
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
          BACKUP_TOOL_DIGEST: ${{ steps.backup-release.outputs.digest }}
        run: |
          artifact_name="distribution-release-$GITHUB_SHA"
          python3 scripts/distribution_release.py create \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --image "$DISTRIBUTION_IMAGE" \
            --tag "$IMAGE_TAG" \
            --digest "$IMAGE_DIGEST" \
            --backup-tool-image "$BACKUP_TOOL_IMAGE" \
            --backup-tool-digest "$BACKUP_TOOL_DIGEST" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output distribution-release.json
          python3 scripts/distribution_release.py validate \
            distribution-release.json \
            --commit "$GITHUB_SHA" \
            --image "$DISTRIBUTION_IMAGE" \
            --backup-tool-image "$BACKUP_TOOL_IMAGE"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload release metadata
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: distribution-release.json
          if-no-files-found: error
          retention-days: 90

      - name: Expose immutable release identity
        env:
          DIGEST_REFERENCE: ${{ steps.release.outputs.digest_reference }}
          BACKUP_TOOL_DIGEST_REFERENCE: ${{ steps.backup-release.outputs.digest_reference }}
          METADATA_ARTIFACT: ${{ steps.metadata.outputs.artifact_name }}
        run: |
          {
            printf '## Distribution release\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Commit tag: `%s:%s`\n' "$DISTRIBUTION_IMAGE" "$IMAGE_TAG"
            printf -- '- Production identity: `%s`\n' "$DIGEST_REFERENCE"
            printf -- '- Backup-tool identity: `%s`\n' "$BACKUP_TOOL_DIGEST_REFERENCE"
            printf -- '- Metadata artifact: `%s`\n' "$METADATA_ARTIFACT"
            printf -- '- OCI SBOM: attached by BuildKit\n'
            printf -- '- Build provenance: BuildKit plus GitHub artifact attestation\n'
          } >> "$GITHUB_STEP_SUMMARY"
