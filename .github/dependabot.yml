# Dependabot runs against the repository default branch (19-usl). Do not add a
# target-branch here: GitHub only applies these settings to security updates
# when the update entry targets the default branch.
version: 2

updates:
  # requirements.txt and requirements-docs.txt. Odoo's upstream pins remain authoritative:
  # routine PRs may refresh compatible releases, while major-version changes
  # arrive through an upstream Odoo update or an explicit qualification task.
  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      - "addons/**"
      - "oca-addons/**"
      - "oca-src/**"
      - "odoo/**"
      - "setup/**"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    groups:
      compatible-python-updates:
        patterns:
          - "*"
        # These packages have a strict mutual compatibility window. Separate
        # PRs make a resolver conflict visible instead of hiding it in a batch.
        exclude-patterns:
          - "cryptography"
          - "pyopenssl"
        update-types:
          - "minor"
          - "patch"
    # Restrict routine version PRs, not security PRs. GitHub documents that
    # allow.update-types never suppresses a security update.
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore(deps)"

  # Transitive Python pins used to make the distribution image reproducible.
  # Keep this separate from direct Odoo requirements so each candidate can be
  # rebuilt and diagnosed without an unrelated manifest rewrite.
  - package-ecosystem: "pip"
    directory: "/docker"
    schedule:
      interval: "monthly"
      time: "06:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    groups:
      compatible-python-lock-updates:
        patterns:
          - "*"
        # Odoo's Python 3.12/Noble runtime still pins lxml 5.2.1. Newer
        # lxml-html-clean releases requiring lxml 6 must be qualified with an
        # upstream runtime update instead of entering the routine lock group.
        exclude-patterns:
          - "lxml-html-clean"
        update-types:
          - "minor"
          - "patch"
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # 0.4.5 requires lxml >= 6.1.1, while the supported Odoo Python 3.12
    # runtime remains on lxml 5.2.1. Ignore only that incompatible release so
    # a later compatible or security release can still be proposed.
    ignore:
      - dependency-name: "lxml-html-clean"
        versions:
          - "0.4.5"
    commit-message:
      prefix: "chore(deps)"

  # Repository-owned frontend dependencies. Major updates stay separate so
  # generated assets can be reviewed with the package update.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    groups:
      compatible-node-tooling-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # Base images used by the multi-stage distribution Dockerfile. Major image
  # updates stay separate so Python/runtime-generation changes are explicit.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    groups:
      compatible-dockerfile-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Paperless's tika-client 0.11 multipart API is not compatible with Tika
    # Server 4, which removed /tika/form/text. A major upgrade requires an
    # explicit Paperless parser qualification instead of a routine image bump.
    ignore:
      - dependency-name: "apache/tika"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"

  # The production backup tool is built from its own Dockerfile and is not
  # discovered by the root Docker update entry.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:15"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    groups:
      compatible-backup-image-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # The governed Paperless overlay has independent base and frontend build
  # images. Keep its candidates separate from the Odoo Distribution image.
  - package-ecosystem: "docker"
    directory: "/deploy/documents/paperless-ngx"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    groups:
      compatible-paperless-image-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # Runtime services shared by development, migration and pre-production.
  # A PR is only a candidate: Paperless, Pocket ID and data-service updates
  # still require the documented clean-install, reconstruction and release
  # qualification before merge.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    # This image is built from deploy/documents/paperless-ngx/Dockerfile and
    # qualified by the repository release workflow. It is not a Docker Hub
    # dependency; its public base images are covered by the Docker entry above.
    ignore:
      - dependency-name: "usl-paperless-ngx"
    groups:
      compatible-service-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # Production backup/recovery qualification uses a separate Compose boundary
  # and therefore needs an explicit directory entry.
  - package-ecosystem: "docker-compose"
    directory: "/deploy/odoo-backup"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:15"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    # Qualification intentionally uses the Distribution release image. Its
    # immutable digest is supplied by release admission, not discovered as a
    # public dependency by Dependabot.
    ignore:
      - dependency-name: "unstaticlabs/usl-odoo"
    groups:
      compatible-backup-service-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # Keep pinned third-party workflow actions current without allowing a bot PR
  # to publish images or bypass the normal pull-request qualification job.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    groups:
      compatible-action-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
