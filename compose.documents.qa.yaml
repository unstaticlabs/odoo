services:
  odoo:
    ports: !override
      - "127.0.0.1:${ODOO_HTTP_PORT}:8069"
      - "127.0.0.1:${ODOO_GEVENT_PORT}:8072"

  paperless-webserver:
    ports: !override
      - "127.0.0.1:${PAPERLESS_HTTP_PORT}:8000"

  paperless-ollama:
    ports:
      - "127.0.0.1:${OLLAMA_HTTP_PORT:-11434}:11434"
